<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Batalha de Opções</title><style>*{box-sizing:border-box}body{margin:0;background:#061019;color:#fff;font-family:Arial,sans-serif}main{max-width:1400px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px;padding:14px 16px;background:#0b1c28;border:1px solid #ffffff10;border-radius:16px}.top h1{margin:0;font-size:24px}.status{font-size:12px;color:#b8c9d5}.dashboard{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(360px,.85fr);gap:16px}.column{display:flex;flex-direction:column;gap:16px}.card{background:#102433;border:1px solid #ffffff10;border-radius:18px;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.head h2{margin:0;font-size:17px}.sub{font-size:11px;color:#8ea6b7;margin-top:3px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:800;color:#c3d4df;margin-bottom:5px}input,select,button{width:100%;border:1px solid #ffffff14;border-radius:10px;padding:10px;background:#07141d;color:#fff}button{cursor:pointer;font-weight:900}.blue{background:#155f87}.green{background:#176b3b}.orange{background:#9a5b16}.gray{background:#3b4a55}.red{background:#7c2936}.purple{background:#5b3483}.gold{background:#9b6b00}.preview{max-width:220px;max-height:120px;object-fit:cover;border-radius:10px;margin-top:7px}.mini-preview{width:100%;height:100px;object-fit:cover;border-radius:10px;margin-top:7px;background:#07141d}.options{display:flex;flex-direction:column;gap:12px}.option{background:#091923;border:1px solid #ffffff0d;border-radius:15px;padding:13px}.option-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.palette{display:grid;grid-template-columns:repeat(9,30px);gap:6px}.swatch{width:30px;height:30px;padding:0;border-radius:7px}.swatch.active{outline:2px solid #fff}.custom-color{display:grid;grid-template-columns:48px 1fr;gap:8px;margin-top:8px}.gift-pair{display:grid;grid-template-columns:1.5fr .7fr;gap:10px}.help{font-size:10px;color:#8299aa;margin-top:4px}.catalog{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#07141d;border-radius:12px;padding:10px 12px;margin-bottom:12px}.catalog button{width:auto}.actions,.row3,.tests,.backup,.sticky{display:grid;gap:8px}.actions,.backup,.sticky{grid-template-columns:1fr 1fr}.row3,.tests{grid-template-columns:repeat(3,1fr)}.switchrow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#091923;border-radius:12px;padding:12px}.switch{position:relative;width:52px;height:28px;flex:none}.switch input{display:none}.slider{position:absolute;inset:0;border-radius:99px;background:#41515d}.slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff}.switch input:checked+.slider{background:#1c9b58}.switch input:checked+.slider:before{transform:translateX(24px)}.timer{font-size:34px;text-align:center;font-weight:900;background:#07141d;border-radius:12px;padding:12px;margin:10px 0}.history{max-height:520px;overflow:auto}.gift-row{display:grid;grid-template-columns:42px 1fr auto;gap:9px;align-items:center;background:#091923;border-radius:11px;padding:8px;margin-bottom:7px}.gift-row img,.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover}.vote{font-size:11px;font-weight:900;background:#176b3b;border-radius:999px;padding:6px 8px}.control-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sticky{position:sticky;bottom:10px;background:#0b1b27f2;border-radius:14px;padding:10px}.title-preview,.champ-preview{min-height:70px;display:grid;place-items:center;text-align:center;background:#07141d;border-radius:12px;padding:10px}@media(max-width:1000px){.dashboard{grid-template-columns:1fr}}@media(max-width:700px){.grid2,.gift-pair,.control-grid,.row3,.tests,.actions,.backup,.sticky{grid-template-columns:1fr}}</style></head><body><main>
<header class="top"><div><h1>🎁 Batalha de Opções</h1><div class="sub">Painel de controle da LIVE</div></div><div id="msg" class="status"></div></header><div class="dashboard"><div class="column">
<section class="card"><div class="head"><h2>⚙️ Aparência da batalha</h2></div><div class="grid2"><div class="full"><label>Nome da batalha</label><input id="title"></div><div class="full"><label>Subtítulo</label><input id="subtitle"></div><div><label>Fonte</label><select id="titleFont"><option>Bangers</option><option>Luckiest Guy</option><option>Anton</option></select></div><div><label>Tamanho</label><select id="titleSize"><option>24</option><option>32</option><option selected>40</option><option>48</option></select></div><div class="full"><label>Prévia do título</label><div class="title-preview"><span id="titlePreview"></span></div></div><div class="full"><label>Texto da comemoração</label><input id="championLabel"><div id="champPreview" class="champ-preview"></div></div><div class="full"><label>Imagem de fundo</label><input id="bg" type="file" accept="image/*"><img id="bgp" class="preview"></div></div></section>
<section class="card"><div class="head"><div><h2>🧩 Opções da batalha</h2><div class="sub">Até 6 opções</div></div><button class="blue" style="width:auto" onclick="add()">➕ ADICIONAR</button></div><div class="catalog"><span>Catálogo TikTok: <b id="catalogCount">0 presentes</b></span><button class="blue" onclick="loadCatalog(true)">↻ ATUALIZAR IDs</button></div><datalist id="giftNamesList"></datalist><div id="opts" class="options"></div></section><section class="card"><h2>🧪 Testes rápidos</h2><div id="tests" class="tests"></div></section></div>
<div class="column"><div class="control-grid"><section class="card"><h2>🗳️ Votação</h2><div class="switchrow"><b>Votos por comentário</b><label class="switch"><input id="commentVoting" type="checkbox"><span class="slider"></span></label></div></section><section class="card"><h2>🏆 Resultado</h2><button class="gold" onclick="champion()">🏆 DECLARAR CAMPEÃO</button></section></div><section class="card"><h2>⏱️ Cronômetro</h2><div class="switchrow"><b>Mostrar na tela principal</b><label class="switch"><input id="showTimer" type="checkbox"><span class="slider"></span></label></div><div id="clock" class="timer">00:00:00</div><div class="row3"><button class="blue" onclick="timerAct('play')">▶ PLAY</button><button class="orange" onclick="timerAct('pause')">⏸ PAUSAR</button><button class="gray" onclick="timerAct('reset')">↺ RESETAR</button></div></section><section class="card"><h2>📥 Envios / Votos da LIVE</h2><div id="history" class="history"></div></section><section class="card"><h2>💾 Backup rápido</h2><div class="backup"><button class="blue" onclick="saveLocal()">SALVAR BACKUP</button><button class="gray" onclick="restoreLocal()">RESTAURAR BACKUP</button></div></section><div class="sticky"><button class="green" onclick="save()">💾 APLICAR E SALVAR</button><button class="red" onclick="resetVotes()">🧹 ZERAR VOTOS</button></div></div></div></main>
<script>const $=id=>document.getElementById(id),BACKUP='batalha-opcoes-backup-v1',COLORS=['#ff0000','#ff9800','#ffd400','#00c853','#2196f3','#673ab7','#e91e63','#ffffff','#111111'];let options=[],history=[],giftCatalog=[],backgroundImage='',timer={elapsedMs:0,running:false,startedAt:null};function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function norm(s=''){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase()}function fmt(ms){let t=Math.floor(ms/1000);return[Math.floor(t/3600),Math.floor(t%3600/60),t%60].map(v=>String(v).padStart(2,'0')).join(':')}function now(){return(+timer.elapsedMs||0)+(timer.running&&timer.startedAt?Date.now()-timer.startedAt:0)}setInterval(()=>$('clock').textContent=fmt(now()),300);async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Erro ${r.status}`);return d}function payload(){return{battle:{title:$('title').value,subtitle:$('subtitle').value,backgroundImage,titleFont:$('titleFont').value,titleSize:+$('titleSize').value,championLabel:$('championLabel').value,showTimer:$('showTimer').checked,commentVoting:$('commentVoting').checked},options:options.map(o=>({...o}))}}function previews(){$('titlePreview').textContent=$('title').value||'BATALHA DAS OPÇÕES';$('champPreview').textContent=$('championLabel').value||'★ VENCEDOR DA BATALHA ★'}['title','championLabel'].forEach(id=>$(id).addEventListener('input',previews));function palette(i){return `<div class="palette">${COLORS.map(c=>`<button class="swatch${String(options[i].color).toLowerCase()===c?' active':''}" style="background:${c}" onclick="setColor(${i},'${c}')"></button>`).join('')}</div><div class="custom-color"><input type="color" value="${options[i].color}" oninput="setColor(${i},this.value)"></div>`}function setColor(i,c){options[i].color=c;render()}function compress(file,maxW,maxH,q=.84){return new Promise((ok,fail)=>{if(!file||!file.type.startsWith('image/'))return fail(Error('Arquivo inválido'));const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{const s=Math.min(1,maxW/img.naturalWidth,maxH/img.naturalHeight),w=Math.max(1,Math.round(img.naturalWidth*s)),h=Math.max(1,Math.round(img.naturalHeight*s)),c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=w;c.height=h;ctx.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);const data=c.toDataURL('image/jpeg',q);if(!data.startsWith('data:image/'))throw Error('Conversão falhou');ok(data)}catch(e){URL.revokeObjectURL(url);fail(e)}};img.onerror=()=>{URL.revokeObjectURL(url);fail(Error('Imagem não pôde ser aberta'))};img.src=url})}function resolveIds(i){const names=String(options[i].gifts||'').split(',').map(x=>x.trim()).filter(Boolean);options[i].giftIds=names.map(n=>giftCatalog.find(g=>norm(g.name)===norm(n))?.id||'').filter(Boolean).join(', ')}async function loadCatalog(show=false){try{const r=await fetch('/api/gifts',{cache:'no-store'}),d=await r.json();giftCatalog=Array.isArray(d.gifts)?d.gifts:[];$('catalogCount').textContent=`${giftCatalog.length} presentes`;$('giftNamesList').innerHTML=giftCatalog.map(g=>`<option value="${esc(g.name)}">`).join('');if(show)$('msg').textContent=`✅ ${giftCatalog.length} IDs carregados`}catch{$('msg').textContent='⚠️ Falha ao carregar IDs'}}function render(){ $('opts').innerHTML=options.map((o,i)=>`<div class="option"><div class="option-head"><b>Opção ${i+1}</b><span>${o.count||0} voto(s)</span></div><div class="grid2"><div><label>Nome</label><input data-k="name" data-i="${i}" value="${esc(o.name)}"></div><div><label>Cor</label>${palette(i)}</div><div class="full gift-pair"><div><label>Nome do presente</label><input list="giftNamesList" data-gname="${i}" value="${esc(o.gifts||'')}"></div><div><label>ID do presente</label><input data-gid="${i}" value="${esc(o.giftIds||'')}"></div></div><div><label>Imagem da opção</label><input type="file" accept="image/*" data-file="image" data-i="${i}">${o.image?`<img class="mini-preview" src="${o.image}" onerror="this.style.display='none'">`:''}</div><div><label>Ícone do presente</label><input type="file" accept="image/*" data-file="giftIcon" data-i="${i}">${o.giftIcon?`<img class="mini-preview" src="${o.giftIcon}" onerror="this.style.display='none'">`:''}</div></div><div class="actions"><button class="purple" onclick="test('${o.id}')">+1 TESTE</button><button class="red" onclick="del(${i})">REMOVER</button></div></div>`).join('');document.querySelectorAll('[data-k]').forEach(e=>e.oninput=()=>options[+e.dataset.i][e.dataset.k]=e.value);document.querySelectorAll('[data-gname]').forEach(e=>e.oninput=()=>{let i=+e.dataset.gname;options[i].gifts=e.value;resolveIds(i)});document.querySelectorAll('[data-gid]').forEach(e=>e.oninput=()=>options[+e.dataset.gid].giftIds=e.value.replace(/[^0-9, ]/g,''));document.querySelectorAll('[data-file]').forEach(e=>e.onchange=async()=>{const f=e.files[0];if(!f)return;const i=+e.dataset.i,key=e.dataset.file;try{$('msg').textContent='⏳ Processando imagem...';options[i][key]=await compress(f,key==='giftIcon'?256:720,key==='giftIcon'?256:1100,key==='giftIcon'?.9:.84);render();$('msg').textContent='✅ Imagem pronta. Clique em APLICAR E SALVAR.'}catch(err){$('msg').textContent='⚠️ '+err.message}});$('tests').innerHTML=options.map(o=>`<button class="purple" onclick="test('${o.id}')">+1 ${esc(o.name)}</button>`).join('')}function renderHistory(){const h=$('history');h.innerHTML=history.length?history.slice(0,100).map(x=>`<div class="gift-row"><div class="avatar">👤</div><div><b>${esc(x.user?.nickname||'TikTok')}</b><div class="sub">${esc(x.giftName||x.comment||'Voto')}</div></div><div class="vote">${esc(x.optionName||'')}</div></div>`).join(''):'<div class="sub">Nenhum voto recebido ainda.</div>'}function add(){if(options.length>=6)return;options.push({id:crypto.randomUUID(),name:`Opção ${options.length+1}`,image:'',giftIcon:'',color:'#2196f3',gifts:'',giftIds:'',count:0});render()}function del(i){options.splice(i,1);render()}async function save(){try{$('msg').textContent='⏳ Salvando imagens e configurações...';const d=await post('/api/config',payload());options=d.options||options;localStorage.setItem(BACKUP,JSON.stringify(payload()));$('msg').textContent=`✅ ${options.length} opções e imagens salvas`;render()}catch(e){$('msg').textContent='⚠️ '+e.message}}function saveLocal(){localStorage.setItem(BACKUP,JSON.stringify(payload()));$('msg').textContent='✅ Backup salvo'}function restoreLocal(){try{applyState(JSON.parse(localStorage.getItem(BACKUP)));$('msg').textContent='✅ Backup restaurado'}catch{$('msg').textContent='⚠️ Sem backup'}}async function test(id){await post('/api/manual',{id,amount:1})}async function resetVotes(){await post('/api/reset');options.forEach(o=>o.count=0);render()}async function timerAct(action){timer=(await post('/api/timer',{action})).timer}async function champion(){const d=await post('/api/champion',{});$('msg').textContent='🏆 Campeão: '+d.champion.name}$('bg').onchange=async()=>{const f=$('bg').files[0];if(!f)return;try{$('msg').textContent='⏳ Processando fundo...';backgroundImage=await compress(f,720,1280,.82);$('bgp').src=backgroundImage;$('msg').textContent='✅ Fundo pronto. Clique em APLICAR E SALVAR.'}catch(e){$('msg').textContent='⚠️ '+e.message}};function applyState(s){if(s?.battle){$('title').value=s.battle.title||'';$('subtitle').value=s.battle.subtitle||'';$('titleFont').value=s.battle.titleFont||'Bangers';$('titleSize').value=String(s.battle.titleSize||40);$('championLabel').value=s.battle.championLabel||'';$('showTimer').checked=s.battle.showTimer===true;$('commentVoting').checked=s.battle.commentVoting===true;backgroundImage=s.battle.backgroundImage||'';$('bgp').src=backgroundImage||'';previews()}if(s?.timer)timer=s.timer;if(Array.isArray(s?.options)){options=s.options;render()}if(Array.isArray(s?.giftHistory)){history=s.giftHistory;renderHistory()}}fetch('/api/state',{cache:'no-store'}).then(r=>r.json()).then(s=>{applyState(s);loadCatalog()}).catch(()=>{$('msg').textContent='⚠️ Falha ao carregar estado'});function connect(){const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/events`);ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='state')applyState(m);else if(m.type==='timer')timer=m.timer}catch{}};ws.onclose=()=>setTimeout(connect,2500)}connect();</script></body></html>
