<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Admin</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Black+Ops+One&family=Bowlby+One+SC&family=Lilita+One&family=Luckiest+Guy&family=Russo+One&family=Titan+One&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#071019;color:#fff;font-family:Arial}main{max-width:900px;margin:auto;padding:16px}.card{background:#102433;border-radius:18px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}input,select,button{width:100%;border:0;border-radius:10px;padding:11px;background:#07141d;color:#fff}button{font-weight:800;cursor:pointer;background:#176b3b}.blue{background:#155f87}.orange{background:#9a5b16}.gray{background:#3b4a55}.red{background:#7c2936}.purple{background:#5b3483}.gold{background:#9b6b00}.option{padding:12px;background:#091923;border-radius:14px;margin:10px 0}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tests{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.muted{font-size:12px;color:#8ea6b7}.timer{font-size:30px;text-align:center;font-weight:900;margin:8px}.preview{max-width:120px;max-height:70px;object-fit:cover;border-radius:8px}.title-preview{min-height:120px;border-radius:14px;background:linear-gradient(135deg,#07141d,#13293a);display:grid;place-items:center;padding:16px;text-align:center;overflow:hidden}.title-preview span{display:block;color:#fff;text-transform:uppercase;line-height:1;text-shadow:0 3px 0 #54219b,0 5px 0 #2c1154,0 8px 16px #0009,0 0 18px #a65cff66}.size-row{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:end}@media(max-width:650px){.grid,.row,.tests{grid-template-columns:1fr}.size-row{grid-template-columns:1fr}}</style></head><body><main><h1>🎁 Batalha de Opções</h1><div id="msg" class="muted"></div><section class="card"><div class="grid"><div class="full"><label>Nome da batalha</label><input id="title"></div><div><label>Fonte do título</label><select id="titleFont"><option>Bangers</option><option>Luckiest Guy</option><option>Bowlby One SC</option><option>Black Ops One</option><option>Russo One</option><option>Titan One</option><option>Anton</option><option>Lilita One</option></select></div><div><label>Tamanho do título</label><select id="titleSize"><option value="24">24 px</option><option value="28">28 px</option><option value="32">32 px</option><option value="36">36 px</option><option value="40">40 px</option><option value="44">44 px</option><option value="48">48 px</option></select></div><div class="full"><label>Prévia do título</label><div class="title-preview"><span id="titlePreview">BATALHA DAS OPÇÕES</span></div></div><div class="full"><label>Subtítulo</label><input id="subtitle"></div><div class="full"><label>Imagem de fundo</label><input id="bg" type="file" accept="image/*"><img id="bgp" class="preview"></div></div></section><section class="card"><h3>⏱️ Tempo de LIVE</h3><div id="clock" class="timer">00:00:00</div><div class="row"><button class="blue" onclick="timerAct('play')">▶ PLAY</button><button class="orange" onclick="timerAct('pause')">⏸ PAUSAR</button><button class="gray" onclick="timerAct('reset')">↺ RESETAR</button></div></section><section class="card"><button class="blue" onclick="add()">➕ ADICIONAR OPÇÃO</button><div id="opts"></div></section><section class="card"><h3>🧪 Testar opções</h3><div id="tests" class="tests"></div></section><section class="card"><button class="gold" onclick="champion()">🏆 DECLARAR CAMPEÃO</button></section><section class="card row"><button onclick="save()">💾 APLICAR</button><button class="red" onclick="resetVotes()">🧹 ZERAR VOTOS</button></section></main><script>const $=id=>document.getElementById(id);let options=[],backgroundImage='',timer={elapsedMs:0,running:false,startedAt:null};function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(ms){let t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return[h,m,s].map(v=>String(v).padStart(2,'0')).join(':')}function now(){return timer.elapsedMs+(timer.running&&timer.startedAt?Date.now()-timer.startedAt:0)}setInterval(()=>$('clock').textContent=fmt(now()),300);async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erro');return d}function updateTitlePreview(){const p=$('titlePreview'),name=$('title').value||'BATALHA DAS OPÇÕES';p.textContent=name;p.style.fontFamily=`'${$('titleFont').value}',sans-serif`;p.style.fontSize=$('titleSize').value+'px'}$('title').addEventListener('input',updateTitlePreview);$('titleFont').addEventListener('change',updateTitlePreview);$('titleSize').addEventListener('change',updateTitlePreview);function render(){$('opts').innerHTML=options.map((o,i)=>`<div class="option"><div class="grid"><div><label>Nome</label><input data-i="${i}" data-k="name" value="${esc(o.name)}"></div><div><label>Cor</label><input type="color" data-i="${i}" data-k="color" value="${o.color}"></div><div class="full"><label>Presentes (vírgula)</label><input data-i="${i}" data-k="gifts" value="${esc(o.gifts)}"></div><div><label>Imagem</label><input type="file" accept="image/*" data-file="image" data-i="${i}"></div><div><label>Ícone do presente</label><input type="file" accept="image/*" data-file="giftIcon" data-i="${i}"></div><div><button class="red" onclick="del(${i})">REMOVER</button></div></div></div>`).join('');document.querySelectorAll('[data-k]').forEach(e=>e.oninput=()=>options[+e.dataset.i][e.dataset.k]=e.value);document.querySelectorAll('[data-file]').forEach(e=>e.onchange=()=>{const f=e.files[0];if(!f)return;const r=new FileReader();r.onload=()=>options[+e.dataset.i][e.dataset.file]=r.result;r.readAsDataURL(f)});$('tests').innerHTML=options.map(o=>`<button class="purple" onclick="test('${o.id}')">+1 ${esc(o.name)}</button>`).join('')}function add(){if(options.length>=6)return;$('msg').textContent='';options.push({id:crypto.randomUUID(),name:'Nova opção',image:'',giftIcon:'',color:'#2f7cff',gifts:'',count:0});render()}function del(i){options.splice(i,1);render()}async function save(){try{await post('/api/config',{battle:{title:$('title').value,subtitle:$('subtitle').value,backgroundImage,titleFont:$('titleFont').value,titleSize:Number($('titleSize').value)},options});$('msg').textContent='✅ Aplicado e salvo'}catch(e){$('msg').textContent='⚠️ '+e.message}}async function test(id){await post('/api/manual',{id,amount:1})}async function resetVotes(){await post('/api/reset');options.forEach(o=>o.count=0);$('msg').textContent='✅ Votos zerados'}async function timerAct(action){try{const d=await post('/api/timer',{action});timer=d.timer;$('clock').textContent=fmt(now());$('msg').textContent='✅ Tempo '+action}catch(e){$('msg').textContent='⚠️ '+e.message}}async function champion(){try{const d=await post('/api/champion',{});$('msg').textContent='🏆 Campeão: '+d.champion.name}catch(e){$('msg').textContent='⚠️ '+e.message}}$('bg').onchange=()=>{const f=$('bg').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{backgroundImage=r.result;$('bgp').src=backgroundImage};r.readAsDataURL(f)};fetch('/api/state').then(r=>r.json()).then(s=>{$('title').value=s.battle?.title||'';$('subtitle').value=s.battle?.subtitle||'';$('titleFont').value=s.battle?.titleFont||'Bangers';$('titleSize').value=String(s.battle?.titleSize||40);backgroundImage=s.battle?.backgroundImage||'';if(backgroundImage)$('bgp').src=backgroundImage;timer=s.timer||timer;options=s.options||[];updateTitlePreview();render()});</script></body></html>
