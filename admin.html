<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Admin - Batalha de Opções</title><style>*{box-sizing:border-box}body{margin:0;background:#071019;color:#fff;font-family:Arial,sans-serif}main{max-width:900px;margin:auto;padding:16px}h1{margin:6px 0 4px}.muted{font-size:12px;color:#8ea6b7}.card{background:#102433;border:1px solid #ffffff12;border-radius:18px;padding:14px;margin:12px 0}.option{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:12px;border-radius:16px;background:#091923;margin:10px 0}.preview{width:90px;height:90px;border-radius:50%;background:#132a3a;overflow:hidden;display:grid;place-items:center;font-size:34px;border:4px solid var(--c,#2f7cff)}.preview img{width:100%;height:100%;object-fit:cover}.gift-preview{width:54px;height:54px;border-radius:12px;background:#132a3a;overflow:hidden;display:grid;place-items:center;font-size:28px;border:1px solid #ffffff18}.gift-preview img{width:100%;height:100%;object-fit:contain}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:10px;color:#a4bbc9;display:block;margin:4px 0}input,button{width:100%;border:0;border-radius:10px;padding:11px;background:#07141d;color:#fff}input[type=color]{padding:4px;height:42px}button{background:#176b3b;font-weight:800;cursor:pointer}.red{background:#7c2936}.blue{background:#155f87}.gold{background:#86610a}.purple{background:#5b3483}.actions,.tests{display:grid;grid-template-columns:1fr 1fr;gap:8px}.test-btn{display:flex;align-items:center;justify-content:center;gap:8px}.full{grid-column:1/-1}.icon-row{display:flex;align-items:center;gap:10px}.icon-row input{flex:1}@media(max-width:620px){.option{grid-template-columns:1fr}.preview{margin:auto}.grid,.tests{grid-template-columns:1fr}}</style></head><body><main><h1>🎁 Batalha de Opções</h1><div class="muted">Painel separado do jogo. Edite a batalha, as opções e os presentes.</div><section class="card"><div class="grid"><div class="full"><label>Nome da batalha</label><input id="battleTitle" maxlength="100" placeholder="BATALHA DAS OPÇÕES"></div><div class="full"><label>Subtítulo</label><input id="battleSubtitle" maxlength="180" placeholder="Envie presentes para a sua opção favorita!"></div></div></section><section class="card"><button class="blue" onclick="addOption()">➕ ADICIONAR OPÇÃO</button><div id="options"></div></section><section class="card"><h3>🧪 TESTAR OPÇÕES</h3><div class="muted">Use estes botões para simular presentes na tela principal.</div><div id="tests" class="tests"></div></section><section class="card actions"><button onclick="save()">💾 APLICAR AGORA</button><button class="red" onclick="resetCounts()">🧹 ZERAR CONTADORES</button></section><div id="msg" class="muted"></div><script>const box=document.getElementById('options'),tests=document.getElementById('tests'),msg=document.getElementById('msg'),titleEl=document.getElementById('battleTitle'),subEl=document.getElementById('battleSubtitle');let options=[];function uid(){return crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function renderTests(){tests.innerHTML=options.map(o=>`<button class="purple test-btn" data-id="${o.id}">${o.giftIcon?`<img src="${o.giftIcon}" style="width:28px;height:28px;object-fit:contain">`:'🎁'} +1 ${esc(o.name)}</button>`).join('');tests.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{await post('/api/manual',{id:b.dataset.id,amount:1});msg.textContent='✅ Teste enviado';})}function render(){box.innerHTML='';options.forEach((o,i)=>{const d=document.createElement('div');d.className='option';d.style.setProperty('--c',o.color);d.innerHTML=`<div class="preview">${o.image?`<img src="${o.image}">`:'🖼️'}</div><div class="grid"><div><label>Nome da opção</label><input data-k="name" value="${esc(o.name)}"></div><div><label>Cor</label><input data-k="color" type="color" value="${o.color}"></div><div class="full"><label>Presentes desta opção (separe por vírgula)</label><input data-k="gifts" value="${esc(o.gifts)}" placeholder="Rosa, Coração, Perfume"></div><div class="full"><label>Imagem da opção</label><input data-file="image" type="file" accept="image/*"></div><div class="full"><label>Ícone do presente que aparece na tela do jogo</label><div class="icon-row"><div class="gift-preview">${o.giftIcon?`<img src="${o.giftIcon}">`:'🎁'}</div><input data-file="giftIcon" type="file" accept="image/*"></div></div><div class="full"><button class="red" data-del>REMOVER OPÇÃO</button></div></div>`;d.querySelectorAll('[data-k]').forEach(inp=>inp.oninput=()=>{o[inp.dataset.k]=inp.value;if(inp.dataset.k==='color')d.style.setProperty('--c',inp.value);renderTests()});d.querySelectorAll('[data-file]').forEach(inp=>inp.onchange=e=>{const f=e.target.files?.[0];if(!f)return;const key=inp.dataset.file,r=new FileReader();r.onload=()=>{o[key]=r.result;render()};r.readAsDataURL(f)});d.querySelector('[data-del]').onclick=()=>{options.splice(i,1);render()};box.appendChild(d)});renderTests()}function addOption(){if(options.length>=6){msg.textContent='⚠️ Máximo de 6 opções.';return}options.push({id:uid(),name:'Nova opção',image:'',giftIcon:'',color:'#2f7cff',gifts:'',count:0});render()}async function post(url,b={}){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}async function save(){try{const d=await post('/api/config',{battle:{title:titleEl.value,subtitle:subEl.value},options});options=d.options||options;render();msg.textContent='✅ Batalha atualizada em tempo real'}catch(e){msg.textContent='⚠️ '+e.message}}async function resetCounts(){if(!confirm('Zerar todos os contadores?'))return;try{await post('/api/reset');options.forEach(o=>o.count=0);render();msg.textContent='✅ Contadores zerados'}catch(e){msg.textContent='⚠️ '+e.message}}fetch('/api/state').then(r=>r.json()).then(s=>{titleEl.value=s.battle?.title||'BATALHA DAS OPÇÕES';subEl.value=s.battle?.subtitle||'';options=(s.options||[]).slice(0,6);render()});</script></main></body></html>
