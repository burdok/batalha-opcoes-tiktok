<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Admin</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Black+Ops+One&family=Bowlby+One+SC&family=Lilita+One&family=Luckiest+Guy&family=Russo+One&family=Titan+One&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#071019;color:#fff;font-family:Arial}main{max-width:900px;margin:auto;padding:16px}.card{background:#102433;border-radius:18px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}input,select,button{width:100%;border:0;border-radius:10px;padding:11px;background:#07141d;color:#fff}button{font-weight:800;cursor:pointer;background:#176b3b}.blue{background:#155f87}.orange{background:#9a5b16}.gray{background:#3b4a55}.red{background:#7c2936}.purple{background:#5b3483}.gold{background:#9b6b00}.option{padding:12px;background:#091923;border-radius:14px;margin:10px 0}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tests{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.muted{font-size:12px;color:#8ea6b7}.timer{font-size:30px;text-align:center;font-weight:900;margin:8px}.preview{max-width:120px;max-height:70px;object-fit:cover;border-radius:8px}.title-preview{min-height:120px;border-radius:14px;background:linear-gradient(135deg,#07141d,#13293a);display:grid;place-items:center;padding:16px;text-align:center;overflow:hidden}.title-preview span{display:block;color:#fff;text-transform:uppercase;line-height:1;-webkit-text-stroke:1px #111;text-shadow:0 3px 0 #111,0 6px 12px #0008}.champ-preview{padding:18px;border-radius:14px;text-align:center;background:radial-gradient(circle,#5f430a,#130d03 55%,#000);font-family:'Bangers',Impact,sans-serif;font-size:26px;letter-spacing:3px;color:#fff2a5;text-shadow:0 3px 0 #8c5b00,0 0 12px #ffd84d}.history{max-height:390px;overflow:auto;display:flex;flex-direction:column;gap:7px}.gift-row{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;background:#091923;border:1px solid #ffffff10;border-radius:12px;padding:9px}.gift-row img,.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#162b39}.gift-main{min-width:0}.gift-user{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gift-detail{font-size:13px;color:#bdd0dd;margin-top:3px}.vote{font-size:12px;font-weight:900;padding:7px 9px;border-radius:999px;background:#176b3b;white-space:nowrap}.qty{color:#ffd84d;font-weight:900}.empty{text-align:center;padding:22px;color:#8ea6b7}.size-row{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:end}@media(max-width:650px){.grid,.row,.tests{grid-template-columns:1fr}.size-row{grid-template-columns:1fr}}</style></head><body><main><h1>🎁 Batalha de Opções</h1><div id="msg" class="muted"></div><section class="card"><div class="grid"><div class="full"><label>Nome da batalha</label><input id="title"></div><div><label>Fonte do título</label><select id="titleFont"><option>Bangers</option><option>Luckiest Guy</option><option>Bowlby One SC</option><option>Black Ops One</option><option>Russo One</option><option>Titan One</option><option>Anton</option><option>Lilita One</option></select></div><div><label>Tamanho do título</label><select id="titleSize"><option value="24">24 px</option><option value="28">28 px</option><option value="32">32 px</option><option value="36">36 px</option><option value="40">40 px</option><option value="44">44 px</option><option value="48">48 px</option></select></div><div class="full"><label>Prévia do título</label><div class="title-preview"><span id="titlePreview">BATALHA DAS OPÇÕES</span></div></div><div class="full"><label>Subtítulo</label><input id="subtitle"></div><div class="full"><label>Texto da comemoração do campeão</label><input id="championLabel" maxlength="80"><div id="champPreview" class="champ-preview">★ VENCEDOR DA BATALHA ★</div></div><div class="full"><label>Imagem de fundo</label><input id="bg" type="file" accept="image/*"><img id="bgp" class="preview"></div></div></section><section class="card"><h3>⏱️ Tempo de LIVE</h3><div id="clock" class="timer">00:00:00</div><div class="row"><button class="blue" onclick="timerAct('play')">▶ PLAY</button><button class="orange" onclick="timerAct('pause')">⏸ PAUSAR</button><button class="gray" onclick="timerAct('reset')">↺ RESETAR</button></div></section><section class="card"><button class="blue" onclick="add()">➕ ADICIONAR OPÇÃO</button><div id="opts"></div></section><section class="card"><h3>📥 Envios / Votos da LIVE</h3><div class="muted" style="margin-bottom:9px">Atualiza automaticamente quando um presente válido é recebido.</div><div id="history" class="history"></div></section><section class="card"><h3>🧪 Testar opções</h3><div id="tests" class="tests"></div></section><section class="card"><button class="gold" onclick="champion()">🏆 DECLARAR CAMPEÃO</button></section><section class="card row"><button onclick="save()">💾 APLICAR</button><button class="red" onclick="resetVotes()">🧹 ZERAR VOTOS</button></section></main><script>const $=id=>document.getElementById(id);let options=[],history=[],backgroundImage='',timer={elapsedMs:0,running:false,startedAt:null};function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(ms){let t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return[h,m,s].map(v=>String(v).padStart(2,'0')).join(':')}function now(){return timer.elapsedMs+(timer.running&&timer.startedAt?Date.now()-timer.startedAt:0)}setInterval(()=>$('clock').textContent=fmt(now()),300);async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erro');return d}function updateTitlePreview(){const p=$('titlePreview'),name=$('title').value||'BATALHA DAS OPÇÕES';p.textContent=name;p.style.fontFamily=`'${$('titleFont').value}',sans-serif`;p.style.fontSize=$('titleSize').value+'px'}function updateChampPreview(){$('champPreview').textContent=$('championLabel').value||'★ VENCEDOR DA BATALHA ★'}$('title').addEventListener('input',updateTitlePreview);$('titleFont').addEventListener('change',updateTitlePreview);$('titleSize').addEventListener('change',updateTitlePreview);$('championLabel').addEventListener('input',updateChampPreview);function renderHistory(){const h=$('history');if(!history.length){h.innerHTML='<div class="empty">Nenhum presente recebido ainda.</div>';return}h.innerHTML=history.slice(0,100).map(x=>{const u=x.user||{},name=esc(u.nickname||u.uniqueId||'TikTok'),avatar=u.avatar?`<img src="${esc(u.avatar)}">`:'<div class="avatar" style="display:grid;place-items:center">👤</div>',q=Math.max(1,Number(x.repeatCount)||1),gift=esc(x.giftName||'Presente'),opt=esc(x.optionName||'Opção'),time=new Date(Number(x.at)||Date.now()).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});return `<div class="gift-row">${avatar}<div class="gift-main"><div class="gift-user">${name}</div><div class="gift-detail"><span class="qty">${q}x</span> ${gift} · ${time}</div></div><div class="vote">Votou em ${opt}</div></div>`}).join('')}function render(){$('opts').innerHTML=options.map((o,i)=>`<div class="option"><div class="grid"><div><label>Nome</label><input data-i="${i}" data-k="name" value="${esc(o.name)}"></div><div><label>Cor</label><input type="color" data-i="${i}" data-k="color" value="${o.color}"></div><div class="full"><label>Presentes (vírgula)</label><input data-i="${i}" data-k="gifts" value="${esc(o.gifts)}"></div><div><label>Imagem</label><input type="file" accept="image/*" data-file="image" data-i="${i}"></div><div><label>Ícone do presente</label><input type="file" accept="image/*" data-file="giftIcon" data-i="${i}"></div><div><button class="red" onclick="del(${i})">REMOVER</button></div></div></div>`).join('');document.querySelectorAll('[data-k]').forEach(e=>e.oninput=()=>options[+e.dataset.i][e.dataset.k]=e.value);document.querySelectorAll('[data-file]').forEach(e=>e.onchange=()=>{const f=e.files[0];if(!f)return;const r=new FileReader();r.onload=()=>options[+e.dataset.i][e.dataset.file]=r.result;r.readAsDataURL(f)});$('tests').innerHTML=options.map(o=>`<button class="purple" onclick="test('${o.id}')">+1 ${esc(o.name)}</button>`).join('')}function add(){if(options.length>=6)return;options.push({id:crypto.randomUUID(),name:'Nova opção',image:'',giftIcon:'',color:'#2f7cff',gifts:'',count:0});render()}function del(i){options.splice(i,1);render()}async function save(){try{const d=await post('/api/config',{battle:{title:$('title').value,subtitle:$('subtitle').value,backgroundImage,titleFont:$('titleFont').value,titleSize:Number($('titleSize').value),championLabel:$('championLabel').value},options});options=d.options||options;$('msg').textContent='✅ Aplicado e salvo'}catch(e){$('msg').textContent='⚠️ '+e.message}}async function test(id){await post('/api/manual',{id,amount:1})}async function resetVotes(){await post('/api/reset');options.forEach(o=>o.count=0);history=[];renderHistory();$('msg').textContent='✅ Votos e histórico zerados'}async function timerAct(action){try{const d=await post('/api/timer',{action});timer=d.timer;$('clock').textContent=fmt(now())}catch(e){$('msg').textContent='⚠️ '+e.message}}async function champion(){try{const d=await post('/api/champion',{});$('msg').textContent='🏆 Campeão: '+d.champion.name}catch(e){$('msg').textContent='⚠️ '+e.message}}$('bg').onchange=()=>{const f=$('bg').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{backgroundImage=r.result;$('bgp').src=backgroundImage};r.readAsDataURL(f)};function applyState(s){if(s.battle){$('title').value=s.battle.title||'';$('subtitle').value=s.battle.subtitle||'';$('titleFont').value=s.battle.titleFont||'Bangers';$('titleSize').value=String(s.battle.titleSize||40);$('championLabel').value=s.battle.championLabel||'★ VENCEDOR DA BATALHA ★';backgroundImage=s.battle.backgroundImage||'';if(backgroundImage)$('bgp').src=backgroundImage;updateTitlePreview();updateChampPreview()}if(s.timer)timer=s.timer;if(s.options){options=s.options;render()}if(Array.isArray(s.giftHistory)){history=s.giftHistory;renderHistory()}}fetch('/api/state').then(r=>r.json()).then(applyState);function connect(){const p=location.protocol==='https:'?'wss':'ws',ws=new WebSocket(`${p}://${location.host}/events`);ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='gift'){if(m.options){options=m.options;render()}if(Array.isArray(m.giftHistory))history=m.giftHistory;else if(m.lastGift)history.unshift(m.lastGift);renderHistory()}else if(m.type==='state')applyState(m);else if(m.type==='timer'&&m.timer)timer=m.timer}catch{}};ws.onclose=()=>setTimeout(connect,2500)}connect();</script></body></html>
