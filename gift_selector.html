<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selecionador de Presentes TikTok</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#061019;color:#fff;font-family:Arial,sans-serif}main{max-width:1180px;margin:auto;padding:18px}h1{margin:0 0 6px}.sub{color:#8ea6b7;font-size:12px;margin-bottom:16px}.bar{display:grid;grid-template-columns:1fr auto auto;gap:8px;position:sticky;top:0;background:#061019;padding:10px 0;z-index:3}input,button{border:1px solid #ffffff18;border-radius:10px;padding:11px;background:#0a1b27;color:#fff}button{font-weight:900;cursor:pointer}.blue{background:#155f87}.green{background:#176b3b}.gray{background:#3b4a55}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.gift{display:grid;grid-template-columns:28px 50px 1fr;gap:9px;align-items:center;background:#102433;border:1px solid #ffffff10;border-radius:14px;padding:9px}.gift img{width:50px;height:50px;object-fit:contain;border-radius:10px;background:#07141d}.gift b{display:block;font-size:13px}.meta{font-size:11px;color:#9cb1c0;margin-top:3px}.out{margin-top:18px;background:#102433;border-radius:15px;padding:14px;position:sticky;bottom:0}.outgrid{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}textarea{width:100%;min-height:80px;background:#07141d;color:#fff;border:1px solid #ffffff12;border-radius:10px;padding:10px;resize:vertical}.count{font-weight:900;color:#58c8ff;margin-bottom:8px}@media(max-width:700px){.bar,.outgrid{grid-template-columns:1fr}}
</style></head><body><main><h1>🎁 Selecionador de Presentes TikTok</h1><div class="sub">Catálogo BR do CSV enviado · marque quantos presentes quiser.</div>
<div class="bar"><input id="q" placeholder="Buscar presente pelo nome ou ID..."><button class="blue" onclick="selectVisible()">SELECIONAR VISÍVEIS</button><button class="gray" onclick="clearAll()">LIMPAR</button></div>
<div id="grid" class="grid"></div>
<div class="out"><div id="count" class="count">0 selecionado(s)</div><div class="outgrid"><div><div class="sub">Nomes dos presentes</div><textarea id="names" readonly></textarea></div><div><div class="sub">Gift IDs</div><textarea id="ids" readonly></textarea></div><button class="green" onclick="copyBoth()">COPIAR NOMES + IDs</button></div></div>
</main><script>
const GIFTS=[];
fetch('/gift_catalog_br.json').then(r=>r.json()).then(d=>{GIFTS.push(...d);draw();updateOut()});let selected=new Set();const q=document.getElementById('q'),grid=document.getElementById('grid');
function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function filtered(){let x=norm(q.value.trim());return GIFTS.filter(g=>!x||norm(g.nome).includes(x)||String(g.gift_id).includes(x))}
function draw(){grid.innerHTML=filtered().map(g=>`<label class="gift"><input type="checkbox" data-id="${g.gift_id}" ${selected.has(String(g.gift_id))?'checked':''}><img src="${g.imagem_url||''}" onerror="this.style.visibility='hidden'"><div><b>${g.nome}</b><div class="meta">ID ${g.gift_id} · ${g.moedas} moeda(s)</div></div></label>`).join('');grid.querySelectorAll('input').forEach(c=>c.onchange=()=>{c.checked?selected.add(c.dataset.id):selected.delete(c.dataset.id);updateOut()})}
function updateOut(){let a=GIFTS.filter(g=>selected.has(String(g.gift_id)));document.getElementById('count').textContent=`${a.length} selecionado(s)`;document.getElementById('names').value=a.map(g=>g.nome).join(', ');document.getElementById('ids').value=a.map(g=>g.gift_id).join(', ')}
function selectVisible(){filtered().forEach(g=>selected.add(String(g.gift_id)));draw();updateOut()}function clearAll(){selected.clear();draw();updateOut()}
async function copyBoth(){let t=`Nomes: ${document.getElementById('names').value}\nIDs: ${document.getElementById('ids').value}`;await navigator.clipboard.writeText(t)}
q.oninput=draw;
</script></body></html>
