e:transform;transform-origin:50% 60%;animation:giftFloat 4.8s linear infinite}.gift-fallback{font-size:26px;display:inline-block;will-change:transform;animation:giftFloat 4.8s linear infinite}.donor-zone{position:relative;z-index:4;height:64px;overflow:hidden;display:flex;align-items:center;justify-content:center}.donor-card{position:absolute;width:96%;height:54px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:9px;padding:6px 10px;border:1px solid #ffffff2b;border-radius:15px;background:linear-gradient(90deg,#07131eea,#10283bea,#07131eea);box-shadow:0 8px 24px #0008;opacity:0;transform:translateX(115%)}.donor-card.show{animation:donorPass 5.2s cubic-bezier(.2,.75,.2,1) forwards}.donor-avatar,.donor-gift{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#142b3b}.donor-gift{border-radius:9px;will-change:transform;animation:giftFloat 3.6s linear infinite}.donor-info{min-width:0}.donor-user{font-weight:900;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.donor-detail{font-size:12px;color:#c5d8e5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.donor-detail b{color:#ffd84d}.live-time{border:1px solid #ffffff12;border-radius:14px;background:#09131ccc;padding:10px;text-align:center;position:relative;z-index:3;margin-top:auto}.live-clock{font-size:22px;font-weight:900}.champ{position:absolute;inset:0;z-index:30;display:none;overflow:hidden;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:22px;background:radial-gradient(circle at 50% 40%,#5f430a99,#130d03e8 37%,#000 78%);backdrop-filter:blur(5px)}.champ.show{display:flex}.champ-rays{position:absolute;width:165%;aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(#ffd84d20 0 8deg,transparent 8deg 17deg);animation:raySpin 12s linear infinite}.champ-ring{position:absolute;width:310px;height:310px;border:2px solid #ffd84d80;border-radius:50%;animation:ringPulse 1.5s ease-in-out infinite}.champ- p'),champBadge=$('champBadge'),champMedia=$('champMedia'),champName=$('champName'),champScore=$('champScore'),fireworks=$('fireworks');let state={battle:{showTimer:true},options:[]},timer={elapsedMs:0,running:false,startedAt:null},giftQueue=[],giftPlaying=false,uiSig='';function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function layout(n){if(n<=1)return[1,1];if(n===2)return[2,1];if(n===3)return[3,1];if(n===4)return[2,2];return[3,2]}function timerNow(){return Math.max(0,+timer.elapsedMs||0)+(timer.running&&timer.startedAt?Math.max(0,Date.now()-+timer.startedAt):0)}function fmt(ms){let t=Math.floor(ms/1000);return[Math.floor(t/3600),Math.floor(t%3600/60),t%60].map(v=>String(v).padStart(2,'0')).join(':')}setInterval(()=>liveClock.textContent=fmt(timerNow()),250);function render(){let b=state.battle||{};titleEl.textContent=b.title||'BATALHA DAS OPÇÕES';titleEl.style.fontFamily=`'${b.titleFont||'Bangers'}',sans-serif`;titleEl.style.fontSize=(b.titleSize||40)+'px';subEl.textContent=b.subtitle||'';liveTime.style.display=b.showTimer===false?'none':'block';app.style.backgroundImage=b.backgroundImage?`linear-gradient(#02070b38,#02070b38),url("${b.backgroundImage}")`:'';let opts=[...state.options].slice(0,6).sort((a,b)=>(+b.count||0)-(+a.count||0)),max=opts.length?Math.max(...opts.map(o=>+o.count||0)):0,top=opts.filter(o=>(+o.count||0)===max),lead=max>0&&top.length===1?top[0].id:null,[c,r]=layout(opts.length);board.style.gridTemplateColumns=`repeat(${c},1fr)`;board.style.gridTemplateRows=`repeat(${r},1fr)`;const sig=JSON.stringify({c,r,b:{title:b.title,subtitle:b.subtitle,backgroundImage:b.backgroundImage,titleFont:b.titleFont,titleSize:b.titleSize,showTimer:b.showTimer},opts:opts.map(o=>({id:o.id,name:o.name,image:o.image,giftIcon:o.giftIcon,color:o.color}))});if(sig!==uiSig){uiSig=sig;board.innerHTML=opts.map((o,i)=>`<article class="option${o.id===lead?' leader':''}" data-id="${esc(o.id)}" style="--c:${o.color};order:${i}"><div class="rank">${i+1}º</div><div class="crown">👑</div><div class="photo">${o.image?`<img src="${o.image}">`:'🖼️'}</div><div class="name">${esc(o.name)}</div><div class="count">${o.giftIcon?`<img class="gift-icon" src="${o.giftIcon}">`:'<span class="gift-fallback">🎁</span>'}<span class="count-value">${+o.count||0}</span></div></article>`).join('')}else{opts.forEach((o,i)=>{const el=[...board.children].find(x=>x.dataset.id===String(o.id));if(!el)return;el.classList.toggle('leader',o.id===lead);el.style.order=String(i);const rank=el.querySelector('.rank'),count=el.querySelector('.count-value');if(rank)rank.textContent=`${i+1}º`;if(count)count.textContent=String(+o.count||0)})}}function queueGift(g){if(!g)return;giftQueue.push(g);if(giftQueue.length>20)giftQueue.shift();playGift()}function playGift(){if(giftPlaying||!giftQueue.length)return;giftPlaying=true;let g=giftQueue.shift(),u=g.user||{},avatar=u.avatar||'',gift=g.giftImage||'',q=Math.max(1,+g.repeatCount||1);donorCard.innerHTML=`${avatar?`<img class="donor-avatar" src="${esc(avatar)}">`:'<div class="donor-avatar" style="display:grid;place-items:center">👤</div>'}<div class="donor-info"><div class="donor-user">${esc(u.nickname||u.uniqueId||'TikTok')}</div><div class="donor-detail">${g.source==='comment'?`comentou <b>${esc(g.comment||g.optionName||'')}</b> → ${esc(g.optionName||'')}`:`enviou <b>${q}x ${esc(g.giftName||'presente')}</b> → ${esc(g.optionName||'')}`}</div></div>${gift?`<img class="donor-gift" src="${esc(gift)}">`:`<div class="donor-gift" style="display:grid;place-items:center">${g.source==='comment'?'💬':'🎁'}</div>`}`;donorCard.classList.remove('show');void donorCard.offsetWidth;donorCard.classList.add('show');setTimeout(()=>{donorCard.classList.remove('show');giftPlaying=false;playGift()},5300)}function fireworksBurst(){fireworks.innerHTML='';for(let i=0;i<100;i++){let s=document.createElement('i'),a=Math.random()*Math.PI*2,d=70+Math.random()*240;s.className='spark';s.style.left=(15+Math.random()*70)+'%';s.style.top=(15+Math.random()*55)+'%';s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');fireworks.appendChild(s)}}function showChampion(c){champBadge.textContent=c.championLabel||state.battle?.championLabel||'★ VENCEDOR DA BATALHA ★';champMedia.innerHTML=c.image?`<img src="${c.image}">`:'🏆';champName.textContent=c.name;champScore.textContent=`${c.count} ${+c.count===1?'PONTO':'PONTOS'}`;champ.classList.add('show');fireworksBurst();setTimeout(()=>champ.classList.remove('show'),12000)}function apply(m){if(m.type==='state'||m.type==='gift'||m.type==='commentVote'){state.battle=m.battle||state.battle;state.options=Array.isArray(m.options)?m.options:state.options;if(m.timer)timer={...m.timer};render();if(m.type==='gift')queueGift(m.lastGift);if(m.type==='commentVote')queueGift(m.vote)}else if(m.type==='timer'&&m.timer)timer={...m.timer};else if(m.type==='champion')showChampion(m.champion)}async function syncState(){try{const r=await fetch('/api/state?ts='+Date.now(),{cache:'no-store'});if(!r.ok)return;const s=await r.json();if(Array.isArray(s.options)){state=s;timer={...(s.timer||timer)};render()}}catch{}}function connect(){let ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/events`);ws.onmessage=e=>{try{apply(JSON.parse(e.data))}catch{}};ws.onopen=()=>syncState();ws.onclose=()=>setTimeout(connect,2000)}syncState();setInterval(syncState,1000);connect();</script></body></html>
