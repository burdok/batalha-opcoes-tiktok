<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Batalha de Opções</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050a0f;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#14283b 0,#071019 48%,#03070b 100%)}
.app{width:min(100vw,56.25vh);height:min(100vh,177.78vw);aspect-ratio:9/16;position:relative;padding:18px 16px 20px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(255,255,255,.004))}
.top{display:flex;align-items:center;justify-content:space-between;font-size:11px}.live{background:#ff204c;padding:8px 12px;border-radius:10px;font-weight:900}.admin{border:1px solid #713b91;border-radius:10px;padding:8px 10px;color:#ddd}.title{text-align:center}.title .label{font-size:10px;color:#b7c2cc;letter-spacing:1.2px}.title h1{margin:3px 0 2px;font-size:clamp(24px,5.7vw,40px);line-height:1.02}.title p{margin:0;color:#b6c3ce;font-size:12px}
#board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px}.option{--c:#2f7cff;position:relative;min-width:0;min-height:0;border:2px solid var(--c);border-radius:20px;padding:12px 8px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 11%,#071019),#09121a 68%);box-shadow:0 0 18px color-mix(in srgb,var(--c) 28%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.option.leader{box-shadow:0 0 34px color-mix(in srgb,var(--c) 62%,transparent);transform:translateY(-2px)}.rank{position:absolute;left:7px;top:7px;width:31px;height:31px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:12px;font-weight:900}.crown{position:absolute;top:-25px;left:50%;transform:translateX(-50%);font-size:42px;display:none;filter:drop-shadow(0 5px 9px #000);z-index:3}.option.leader .crown{display:block}.photo{width:min(82%,112px);aspect-ratio:1;border-radius:50%;border:4px solid var(--c);overflow:hidden;background:#12202b;display:grid;place-items:center;font-size:40px;box-shadow:0 8px 18px #0007}.photo img{width:100%;height:100%;object-fit:cover}.name{margin-top:10px;font-size:clamp(14px,3vw,20px);line-height:1.05;font-weight:900;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.count{margin-top:8px;font-size:clamp(24px,5.2vw,36px);line-height:1;font-weight:1000;color:var(--c)}.count small{display:block;margin-top:5px;font-size:10px;color:#c1cbd2;font-weight:700}
.bottom{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch}.how,.time{border:1px solid #ffffff12;border-radius:14px;background:#09131c;padding:10px}.how{font-size:10px;color:#c6d0d7;line-height:1.35}.how b{color:#d55cff}.time{min-width:110px;text-align:center}.time small{display:block;color:#9eb0bd;font-size:9px}.time strong{font-size:20px}.last{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font-size:9px;color:#7f98a8;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<main class="app">
  <div class="top"><span class="live">● LIVE</span><span class="admin">⚙ PAINEL ADMIN</span></div>
  <section class="title"><div class="label">NOME DA BATALHA ✎</div><h1 id="battleTitle">BATALHA DAS OPÇÕES</h1><p id="battleSubtitle">Envie presentes para a sua opção favorita!</p></section>
  <section id="board"></section>
  <section class="bottom"><div class="how"><b>🎁 Como jogar:</b> envie o presente da sua opção favorita. Cada presente recebido soma +1.</div><div class="time"><small>TEMPO DA LIVE</small><strong id="timer">00:00:00</strong></div></section>
  <div id="last" class="last">Aguardando presentes...</div>
</main>
<script>
const board=document.getElementById('board'),last=document.getElementById('last'),titleEl=document.getElementById('battleTitle'),subEl=document.getElementById('battleSubtitle'),timerEl=document.getElementById('timer');
let state={battle:{title:'BATALHA DAS OPÇÕES',subtitle:''},options:[],lastGift:null},started=Date.now();
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){titleEl.textContent=state.battle?.title||'BATALHA DAS OPÇÕES';subEl.textContent=state.battle?.subtitle||'';const opts=[...state.options].sort((a,b)=>b.count-a.count).slice(0,6),max=opts.length?Math.max(...opts.map(o=>o.count)):0,leaders=max>0?new Set(opts.filter(o=>o.count===max).map(o=>o.id)):new Set();board.innerHTML=opts.map((o,i)=>`<article class="option${leaders.has(o.id)?' leader':''}" style="--c:${o.color}"><div class="rank">${i+1}º</div><div class="crown">👑</div><div class="photo">${o.image?`<img src="${o.image}" alt="">`:'🖼️'}</div><div class="name">${esc(o.name)}</div><div class="count">${o.count}<small>🎁 presentes</small></div></article>`).join('');if(state.lastGift){const g=state.lastGift;last.textContent=`🎁 ${g.user?.nickname||g.user?.uniqueId||'Usuário'} enviou ${g.giftName}${g.repeatCount>1?' x'+g.repeatCount:''} → ${g.optionName}`}}
function connect(){const p=location.protocol==='https:'?'wss':'ws',ws=new WebSocket(`${p}://${location.host}/events`);ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='state'||m.type==='gift'){state.battle=m.battle||state.battle;state.options=m.options||state.options;state.lastGift=m.lastGift??state.lastGift;render()}};ws.onclose=()=>setTimeout(connect,2500)}
setInterval(()=>{const s=Math.floor((Date.now()-started)/1000),h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s%3600/60)).padStart(2,'0'),sec=String(s%60).padStart(2,'0');timerEl.textContent=`${h}:${m}:${sec}`},1000);
fetch('/api/state').then(r=>r.json()).then(s=>{state=s;render()});connect();
</script>
</body></html>
