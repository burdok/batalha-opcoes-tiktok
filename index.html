<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Batalha de Opções</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050a0f;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#14283b 0,#071019 48%,#03070b 100%)}
.app{width:min(100vw,56.25vh);height:min(100vh,177.78vw);aspect-ratio:9/16;position:relative;padding:18px 16px 20px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(255,255,255,.004))}
.top{display:flex;align-items:center;justify-content:space-between;font-size:11px}.live{background:#ff204c;padding:8px 12px;border-radius:10px;font-weight:900}.admin{border:1px solid #713b91;border-radius:10px;padding:8px 10px;color:#ddd}.title{text-align:center}.title .label{font-size:10px;color:#b7c2cc;letter-spacing:1.2px}.title h1{margin:3px 0 2px;font-size:clamp(22px,5.4vw,38px);line-height:1.02}.title p{margin:0;color:#b6c3ce;font-size:12px}
#board{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}.option{--c:#2f7cff;position:relative;flex:1;min-height:0;display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;border:2px solid var(--c);border-radius:18px;padding:10px 12px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 12%,#071019),#09121a 65%);box-shadow:0 0 18px color-mix(in srgb,var(--c) 25%,transparent)}.option.leader{box-shadow:0 0 30px color-mix(in srgb,var(--c) 58%,transparent)}.rank{position:absolute;left:8px;top:8px;width:34px;height:34px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:14px;font-weight:900}.crown{position:absolute;left:54px;top:-20px;font-size:38px;display:none;filter:drop-shadow(0 5px 9px #000)}.option.leader .crown{display:block}.photo{width:82px;height:82px;border-radius:50%;border:4px solid var(--c);overflow:hidden;background:#12202b;display:grid;place-items:center;font-size:34px}.photo img{width:100%;height:100%;object-fit:cover}.info{min-width:0}.name{font-size:clamp(18px,4vw,28px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.count{font-size:clamp(28px,6.5vw,46px);font-weight:1000;color:var(--c);line-height:1}.count small{font-size:11px;color:#c1cbd2;font-weight:700}.gifts{margin-top:5px;font-size:10px;color:#a8bac6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{height:7px;background:#15222c;border-radius:20px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--c);border-radius:20px}
.bottom{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch}.how,.time{border:1px solid #ffffff12;border-radius:14px;background:#09131c;padding:10px}.how{font-size:10px;color:#c6d0d7;line-height:1.35}.how b{color:#d55cff}.time{min-width:110px;text-align:center}.time small{display:block;color:#9eb0bd;font-size:9px}.time strong{font-size:20px}.last{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font-size:9px;color:#7f98a8;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<main class="app">
  <div class="top"><span class="live">● LIVE</span><span class="admin">⚙ PAINEL ADMIN</span></div>
  <section class="title"><div class="label">NOME DA BATALHA ✎</div><h1 id="battleTitle">BATALHA DAS OPÇÕES</h1><p id="battleSubtitle">Envie presentes para a sua opção favorita!</p></section>
  <section id="board"></section>
  <section class="bottom"><div class="how"><b>🎁 Como jogar:</b> envie um dos presentes da sua opção favorita. Cada presente recebido soma +1 para a opção correspondente.</div><div class="time"><small>TEMPO DA LIVE</small><strong id="timer">00:00:00</strong></div></section>
  <div id="last" class="last">Aguardando presentes...</div>
</main>
<script>
const board=document.getElementById('board'),last=document.getElementById('last'),titleEl=document.getElementById('battleTitle'),subEl=document.getElementById('battleSubtitle'),timerEl=document.getElementById('timer');
let state={battle:{title:'BATALHA DAS OPÇÕES',subtitle:''},options:[],lastGift:null},started=Date.now();
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){titleEl.textContent=state.battle?.title||'BATALHA DAS OPÇÕES';subEl.textContent=state.battle?.subtitle||'';const opts=[...state.options].sort((a,b)=>b.count-a.count),max=opts.length?Math.max(...opts.map(o=>o.count)):0,leaders=max>0?new Set(opts.filter(o=>o.count===max).map(o=>o.id)):new Set();board.innerHTML=opts.map((o,i)=>{const pct=max?Math.max(7,Math.round(o.count/max*100)):7;return `<article class="option${leaders.has(o.id)?' leader':''}" style="--c:${o.color}"><div class="rank">${i+1}º</div><div class="crown">👑</div><div class="photo">${o.image?`<img src="${o.image}" alt="">`:'🖼️'}</div><div class="info"><div class="name">${esc(o.name)}</div><div class="count">${o.count} <small>🎁 presentes</small></div><div class="gifts">Presentes: ${esc(o.gifts||'—')}</div><div class="bar"><i style="width:${pct}%"></i></div></div></article>`}).join('');if(state.lastGift){const g=state.lastGift;last.textContent=`🎁 ${g.user?.nickname||g.user?.uniqueId||'Usuário'} enviou ${g.giftName}${g.repeatCount>1?' x'+g.repeatCount:''} → ${g.optionName}`}}
function connect(){const p=location.protocol==='https:'?'wss':'ws',ws=new WebSocket(`${p}://${location.host}/events`);ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='state'||m.type==='gift'){state.battle=m.battle||state.battle;state.options=m.options||state.options;state.lastGift=m.lastGift??state.lastGift;render()}};ws.onclose=()=>setTimeout(connect,2500)}
setInterval(()=>{const s=Math.floor((Date.now()-started)/1000),h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s%3600/60)).padStart(2,'0'),sec=String(s%60).padStart(2,'0');timerEl.textContent=`${h}:${m}:${sec}`},1000);
fetch('/api/state').then(r=>r.json()).then(s=>{state=s;render()});connect();
</script>
</body></html>
