<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Batalha de Opções</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Black+Ops+One&family=Bowlby+One+SC&family=Lilita+One&family=Luckiest+Guy&family=Russo+One&family=Titan+One&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050a0f;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:grid;place-items:center}.app{width:min(100vw,56.25vh);height:min(100vh,177.78vw);aspect-ratio:9/16;position:relative;padding:18px 16px 20px;display:flex;flex-direction:column;gap:12px;overflow:hidden;background:radial-gradient(circle at 50% 10%,#14283b 0,#071019 48%,#03070b 100%);background-size:cover;background-position:center}.app:before{content:"";position:absolute;inset:0;background:rgba(2,7,11,.28);z-index:0}.title{text-align:center;position:relative;z-index:3}.title h1{margin:0 0 4px;font-weight:900;letter-spacing:1.5px;line-height:.96;text-transform:uppercase;color:#fff;-webkit-text-stroke:1.5px #111;text-shadow:0 3px 0 #111,0 6px 12px rgba(0,0,0,.55);animation:titleMove 3.4s ease-in-out infinite}.title p{margin:0;color:#d2dbe2;font-size:12px;text-shadow:0 2px 5px #000}.particle{position:absolute;bottom:-30px;width:6px;height:6px;border-radius:50%;background:#76cdff52;animation:floatUp linear infinite;z-index:1}.particle:nth-child(1){left:8%;animation-duration:9s}.particle:nth-child(2){left:22%;animation-duration:12s}.particle:nth-child(3){left:39%;animation-duration:10s}.particle:nth-child(4){left:58%;animation-duration:13s}.particle:nth-child(5){left:73%;animation-duration:11s}.particle:nth-child(6){left:91%;animation-duration:14s}#board{height:60%;flex:none;display:grid;gap:10px;min-height:0;position:relative;z-index:2}.option{--c:#2f7cff;position:relative;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border:2px solid var(--c);border-radius:18px;padding:0;overflow:hidden;background:#09121a;box-shadow:0 0 18px color-mix(in srgb,var(--c) 25%,transparent)}.option:before{content:"";position:absolute;top:-35%;left:-70%;width:45%;height:170%;background:linear-gradient(90deg,transparent,#ffffff21,transparent);transform:rotate(17deg);z-index:3;animation:shine 5.8s ease-in-out infinite}.option.leader{box-shadow:0 0 30px color-mix(in srgb,var(--c) 58%,transparent);animation:leaderPulse 2.4s ease-in-out infinite}.rank{position:absolute;left:7px;top:7px;width:30px;height:30px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:12px;font-weight:900;z-index:5}.crown{position:absolute;top:6px;right:7px;font-size:40px;display:none;z-index:5}.option.leader .crown{display:block;animation:crownFloat 1.4s ease-in-out infinite alternate}.photo{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background:#12202b;display:grid;place-items:center;font-size:48px}.photo img{width:100%;height:100%;object-fit:cover;animation:kenburns 10s ease-in-out infinite alternate}.option:after{content:"";position:absolute;inset:42% 0 0;background:linear-gradient(180deg,transparent,#02070bc7 35%,#02070bf5);z-index:1}.name{position:relative;z-index:2;font-size:clamp(13px,2.8vw,20px);font-weight:900;margin:0 6px 7px;text-align:center;width:calc(100% - 12px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 6px #000}.count{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:7px;font-size:clamp(24px,5.5vw,38px);font-weight:1000;color:var(--c);margin:0 0 12px;text-shadow:0 2px 6px #000}.gift-icon{width:30px;height:30px;object-fit:contain;animation:giftBob 1.8s ease-in-out infinite alternate}.gift-fallback{font-size:26px}.live-time{border:1px solid #ffffff12;border-radius:14px;background:#09131ccc;padding:10px;text-align:center;position:relative;z-index:3;margin-top:auto}.live-clock{font-size:22px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}.champ{position:absolute;inset:0;z-index:30;display:none;overflow:hidden;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:22px;background:radial-gradient(circle at 50% 40%,#5f430a99 0,#130d03e8 37%,#000 78%);backdrop-filter:blur(5px)}.champ.show{display:flex;animation:champSceneIn .35s ease-out}.champ-rays{position:absolute;width:165%;aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(from 0deg,#ffd84d20 0deg 8deg,transparent 8deg 17deg);animation:raySpin 12s linear infinite}.champ-ring{position:absolute;width:310px;height:310px;border:2px solid #ffd84d80;border-radius:50%;box-shadow:0 0 25px #ffd84d55,inset 0 0 25px #ffd84d33;animation:ringPulse 1.5s ease-in-out infinite}.champ-badge{position:relative;z-index:4;font-family:'Bangers',Impact,sans-serif;font-size:25px;letter-spacing:4px;color:#fff2a5;text-shadow:0 3px 0 #8c5b00,0 0 18px #ffd84d;margin-bottom:12px;animation:badgeDrop .65s cubic-bezier(.2,1.5,.4,1)}.champ-media{position:relative;z-index:4;width:72%;aspect-ratio:1;display:grid;place-items:center}.champ-media:before{content:'👑';position:absolute;z-index:7;top:-47px;font-size:70px;filter:drop-shadow(0 6px 5px #000);animation:crownWin .8s ease-in-out infinite alternate}.champ-media img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:7px solid #ffd84d;box-shadow:0 0 0 5px #7c5000,0 0 35px #ffd84dcc,0 0 90px #ff9d00aa;animation:winnerPop .8s cubic-bezier(.18,1.35,.35,1),winnerFloat 2.2s ease-in-out .8s infinite alternate}.champ-media .fallback{font-size:120px}.champ h2{position:relative;z-index:4;font-family:'Bangers',Impact,sans-serif;font-size:clamp(48px,13vw,76px);line-height:.85;letter-spacing:2px;margin:22px 0 8px;color:#ffd84d;text-shadow:0 4px 0 #a36200,0 7px 0 #4d2a00,0 0 25px #ffbf00;animation:champText .7s cubic-bezier(.2,1.5,.3,1)}.champ p{position:relative;z-index:4;font-family:'Russo One',Arial,sans-serif;font-size:clamp(19px,5vw,27px);margin:0;color:#fff;text-shadow:0 3px 8px #000}.champ-score{display:inline-block;margin-top:10px;padding:7px 18px;border-radius:999px;background:linear-gradient(180deg,#ffd84d,#e89b00);color:#251400;font-weight:900;box-shadow:0 5px 18px #0008;animation:scorePulse 1s ease-in-out infinite alternate}.fireworks{position:absolute;inset:0;z-index:3;overflow:hidden;pointer-events:none}.spark{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;animation:boom 1.45s ease-out forwards}.spark:nth-child(4n){background:#ffd84d;box-shadow:0 0 10px #ffd84d}.spark:nth-child(4n+1){background:#ff476f;box-shadow:0 0 10px #ff476f}.spark:nth-child(4n+2){background:#49dfff;box-shadow:0 0 10px #49dfff}.spark:nth-child(4n+3){background:#74ff6b;box-shadow:0 0 10px #74ff6b}.confetti{position:absolute;z-index:3;top:-30px;width:9px;height:18px;border-radius:2px;animation:confettiFall linear forwards}.flash{position:absolute;inset:0;z-index:2;background:#fff;opacity:0;pointer-events:none}.champ.show .flash{animation:flashWin .55s ease-out}@keyframes champSceneIn{from{opacity:0}to{opacity:1}}@keyframes raySpin{to{transform:rotate(360deg)}}@keyframes ringPulse{50%{transform:scale(1.12);opacity:.45}}@keyframes badgeDrop{from{transform:translateY(-70px) scale(.5);opacity:0}to{transform:none;opacity:1}}@keyframes winnerPop{0%{transform:scale(.15) rotate(-18deg);opacity:0}70%{transform:scale(1.1) rotate(3deg)}100%{transform:scale(1);opacity:1}}@keyframes winnerFloat{to{transform:translateY(-8px) scale(1.025)}}@keyframes crownWin{to{transform:translateY(-9px) rotate(5deg) scale(1.06)}}@keyframes champText{from{transform:scale(.25);opacity:0}to{transform:scale(1);opacity:1}}@keyframes scorePulse{to{transform:scale(1.08);filter:brightness(1.15)}}@keyframes flashWin{0%{opacity:.85}100%{opacity:0}}@keyframes boom{0%{transform:translate(0,0) scale(1.4);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(.15);opacity:0}}@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(1050px) rotate(900deg);opacity:.8}}@keyframes kenburns{0%{transform:scale(1.035) translateX(-1%)}100%{transform:scale(1.07) translateX(1%)}}@keyframes shine{0%,64%{left:-70%;opacity:0}72%{opacity:1}90%,100%{left:135%;opacity:0}}@keyframes crownFloat{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-7px) rotate(4deg)}}@keyframes giftBob{to{transform:translateY(-3px)}}@keyframes leaderPulse{50%{filter:brightness(1.08)}}@keyframes titleMove{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@keyframes floatUp{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-1050px);opacity:0}}</style></head><body><main id="app" class="app"><i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i><section class="title"><h1 id="battleTitle">BATALHA DAS OPÇÕES</h1><p id="battleSubtitle"></p></section><section id="board"></section><section class="live-time"><span id="liveClock" class="live-clock">00:00:00</span></section><section id="champ" class="champ"><div class="flash"></div><div class="champ-rays"></div><div class="champ-ring"></div><div id="fireworks" class="fireworks"></div><div class="champ-badge">★ VENCEDOR DA BATALHA ★</div><div id="champMedia" class="champ-media"></div><h2>CAMPEÃO!</h2><p id="champName"></p><div id="champScore" class="champ-score"></div></section></main><script>const app=document.getElementById('app'),board=document.getElementById('board'),titleEl=document.getElementById('battleTitle'),subEl=document.getElementById('battleSubtitle'),liveClock=document.getElementById('liveClock'),champ=document.getElementById('champ'),champMedia=document.getElementById('champMedia'),champName=document.getElementById('champName'),champScore=document.getElementById('champScore'),fireworks=document.getElementById('fireworks');let state={battle:{title:'BATALHA DAS OPÇÕES',subtitle:'',backgroundImage:'',titleFont:'Bangers',titleSize:40},options:[]},timer={elapsedMs:0,running:false,startedAt:null};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function layout(n){if(n<=1)return{c:1,r:1};if(n===2)return{c:2,r:1};if(n===3)return{c:3,r:1};if(n===4)return{c:2,r:2};return{c:3,r:2}}function timerNow(){return Math.max(0,Number(timer.elapsedMs)||0)+(timer.running&&timer.startedAt?Math.max(0,Date.now()-Number(timer.startedAt)):0)}function fmt(ms){const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return[h,m,s].map(v=>String(v).padStart(2,'0')).join(':')}setInterval(()=>liveClock.textContent=fmt(timerNow()),250);function render(){const b=state.battle||{};titleEl.textContent=b.title||'BATALHA DAS OPÇÕES';titleEl.style.fontFamily=`'${b.titleFont||'Bangers'}',sans-serif`;titleEl.style.fontSize=(b.titleSize||40)+'px';subEl.textContent=b.subtitle||'';const bg=b.backgroundImage||'';app.style.backgroundImage=bg?`linear-gradient(#02070b38,#02070b38),url("${bg}")`:'';const opts=[...state.options].slice(0,6).sort((a,b)=>b.count-a.count),max=opts.length?Math.max(...opts.map(o=>o.count)):0,top=opts.filter(o=>o.count===max),leaderId=max>0&&top.length===1?top[0].id:null,l=layout(opts.length);board.style.gridTemplateColumns=`repeat(${l.c},minmax(0,1fr))`;board.style.gridTemplateRows=`repeat(${l.r},minmax(0,1fr))`;board.innerHTML=opts.map((o,i)=>`<article class="option${o.id===leaderId?' leader':''}" style="--c:${o.color}"><div class="rank">${i+1}º</div><div class="crown">👑</div><div class="photo">${o.image?`<img src="${o.image}">`:'🖼️'}</div><div class="name">${esc(o.name)}</div><div class="count">${o.giftIcon?`<img class="gift-icon" src="${o.giftIcon}">`:'<span class="gift-fallback">🎁</span>'}<span>${o.count}</span></div></article>`).join('')}function celebrationBurst(){fireworks.innerHTML='';for(let burst=0;burst<7;burst++){const cx=12+Math.random()*76,cy=12+Math.random()*54;for(let i=0;i<26;i++){const s=document.createElement('i');s.className='spark';const a=Math.random()*Math.PI*2,d=70+Math.random()*230;s.style.left=cx+'%';s.style.top=cy+'%';s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');s.style.animationDelay=(burst*.18+Math.random()*.22)+'s';fireworks.appendChild(s)}}for(let i=0;i<75;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=['#ffd84d','#ff476f','#49dfff','#74ff6b','#fff'][i%5];c.style.animationDuration=(2.5+Math.random()*2.4)+'s';c.style.animationDelay=(Math.random()*1.4)+'s';fireworks.appendChild(c)}}function showChampion(c){champMedia.innerHTML=c.image?`<img src="${c.image}">`:'<div class="fallback">🏆</div>';champName.textContent=c.name;champScore.textContent=`${c.count} ${Number(c.count)===1?'PONTO':'PONTOS'}`;champ.classList.remove('show');void champ.offsetWidth;champ.classList.add('show');celebrationBurst();setTimeout(celebrationBurst,2600);setTimeout(celebrationBurst,5200);setTimeout(celebrationBurst,7800);setTimeout(()=>champ.classList.remove('show'),12000)}function applyMessage(m){if(m.type==='state'||m.type==='gift'){state.battle=m.battle||state.battle;state.options=m.options||state.options;if(m.timer)timer={...m.timer};render()}else if(m.type==='timer'&&m.timer){timer={...m.timer};liveClock.textContent=fmt(timerNow())}else if(m.type==='champion'&&m.champion)showChampion(m.champion)}function connect(){const p=location.protocol==='https:'?'wss':'ws',ws=new WebSocket(`${p}://${location.host}/events`);ws.onmessage=e=>{try{applyMessage(JSON.parse(e.data))}catch{}};ws.onclose=()=>setTimeout(connect,2500)}fetch('/api/state').then(r=>r.json()).then(s=>{state=s;timer={...(s.timer||timer)};render();liveClock.textContent=fmt(timerNow())});connect();</script></body></html>
