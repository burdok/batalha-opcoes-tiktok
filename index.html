<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Batalha de Opções</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050a0f;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#14283b 0,#071019 48%,#03070b 100%)}
.app{width:min(100vw,56.25vh);height:min(100vh,177.78vw);aspect-ratio:9/16;position:relative;padding:18px 16px 20px;display:flex;flex-direction:column;gap:12px}.title{text-align:center}.title .label{font-size:10px;color:#b7c2cc;letter-spacing:1.2px}.title h1{margin:3px 0 2px;font-size:clamp(22px,5.4vw,38px);line-height:1.02}.title p{margin:0;color:#b6c3ce;font-size:12px}
#board{flex:1;display:grid;gap:10px;min-height:0}.option{--c:#2f7cff;position:relative;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border:2px solid var(--c);border-radius:18px;padding:0;overflow:hidden;background:#09121a;box-shadow:0 0 18px color-mix(in srgb,var(--c) 25%,transparent)}.option.leader{box-shadow:0 0 30px color-mix(in srgb,var(--c) 58%,transparent)}.rank{position:absolute;left:7px;top:7px;width:30px;height:30px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:12px;font-weight:900;z-index:4;box-shadow:0 2px 8px #0009}.crown{position:absolute;top:6px;right:7px;font-size:40px;display:none;filter:drop-shadow(0 5px 9px #000);z-index:4}.option.leader .crown{display:block}.photo{position:absolute;inset:0;width:100%;height:100%;border-radius:0;border:0;overflow:hidden;background:#12202b;display:grid;place-items:center;font-size:48px}.photo img{width:100%;height:100%;object-fit:cover}.option:after{content:"";position:absolute;inset:42% 0 0;background:linear-gradient(180deg,transparent,rgba(2,7,11,.78) 35%,rgba(2,7,11,.96));z-index:1;pointer-events:none}.name{position:relative;z-index:2;font-size:clamp(13px,2.8vw,20px);font-weight:900;margin:0 6px 7px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:calc(100% - 12px);text-shadow:0 2px 6px #000}.count{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:7px;font-size:clamp(24px,5.5vw,38px);font-weight:1000;color:var(--c);line-height:1;margin:0 0 12px;text-shadow:0 2px 6px #000}.gift-icon{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 2px 4px #0008)}.gift-fallback{font-size:26px}.bottom{border:1px solid #ffffff12;border-radius:14px;background:#09131c;padding:10px;text-align:center;font-size:10px;color:#c6d0d7}.bottom b{color:#d55cff}.last{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font-size:9px;color:#7f98a8;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><main class="app"><section class="title"><div class="label">NOME DA BATALHA</div><h1 id="battleTitle">BATALHA DAS OPÇÕES</h1><p id="battleSubtitle">Envie presentes para a sua opção favorita!</p></section><section id="board"></section><section class="bottom"><b>🎁 Como jogar:</b> envie o presente da sua opção favorita. Cada presente recebido soma +1.</section><div id="last" class="last">Aguardando presentes...</div></main>
<script>
const board=document.getElementById('board'),last=document.getElementById('last'),titleEl=document.getElementById('battleTitle'),subEl=document.getElementById('battleSubtitle');let state={battle:{title:'BATALHA DAS OPÇÕES',subtitle:''},options:[],lastGift:null};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function layout(n){if(n<=1)return{c:1,r:1};if(n===2)return{c:2,r:1};if(n===3)return{c:3,r:1};if(n===4)return{c:2,r:2};return{c:3,r:2}}
function render(){titleEl.textContent=state.battle?.title||'BATALHA DAS OPÇÕES';subEl.textContent=state.battle?.subtitle||'';const opts=[...state.options].slice(0,6).sort((a,b)=>b.count-a.count),max=opts.length?Math.max(...opts.map(o=>o.count)):0,top=opts.filter(o=>o.count===max),leaderId=max>0&&top.length===1?top[0].id:null;const l=layout(opts.length);board.style.gridTemplateColumns=`repeat(${l.c},minmax(0,1fr))`;board.style.gridTemplateRows=`repeat(${l.r},minmax(0,1fr))`;board.innerHTML=opts.map((o,i)=>`<article class="option${o.id===leaderId?' leader':''}" style="--c:${o.color}"><div class="rank">${i+1}º</div><div class="crown">👑</div><div class="photo">${o.image?`<img src="${o.image}" alt="">`:'🖼️'}</div><div class="name">${esc(o.name)}</div><div class="count">${o.giftIcon?`<img class="gift-icon" src="${o.giftIcon}" alt="">`:'<span class="gift-fallback">🎁</span>'}<span>${o.count}</span></div></article>`).join('');if(state.lastGift){const g=state.lastGift;last.textContent=`${g.user?.nickname||g.user?.uniqueId||'Usuário'} +${g.repeatCount||1} → ${g.optionName}`}}
function connect(){const p=location.protocol==='https:'?'wss':'ws',ws=new WebSocket(`${p}://${location.host}/events`);ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='state'||m.type==='gift'){state.battle=m.battle||state.battle;state.options=m.options||state.options;state.lastGift=m.lastGift??state.lastGift;render()}};ws.onclose=()=>setTimeout(connect,2500)}fetch('/api/state').then(r=>r.json()).then(s=>{state=s;render()});connect();
</script></body></html>
