<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Batalha de Opções</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050a0f;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#14283b 0,#071019 48%,#03070b 100%)}
.app{width:min(100vw,56.25vh);height:min(100vh,177.78vw);aspect-ratio:9/16;position:relative;padding:18px 16px 20px;display:flex;flex-direction:column;gap:12px;overflow:hidden}.title{text-align:center;position:relative;z-index:3}.title .label{font-size:10px;color:#b7c2cc;letter-spacing:1.2px}.title h1{margin:3px 0 2px;font-size:clamp(22px,5.4vw,38px);line-height:1.02;animation:titleGlow 3.2s ease-in-out infinite}.title p{margin:0;color:#b6c3ce;font-size:12px}
#motionBg{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}.particle{position:absolute;bottom:-30px;width:6px;height:6px;border-radius:50%;background:rgba(118,205,255,.32);box-shadow:0 0 12px rgba(118,205,255,.32);animation:floatUp linear infinite}.particle:nth-child(1){left:8%;animation-duration:9s;animation-delay:-2s}.particle:nth-child(2){left:22%;animation-duration:12s;animation-delay:-7s;width:4px;height:4px}.particle:nth-child(3){left:39%;animation-duration:10s;animation-delay:-4s}.particle:nth-child(4){left:58%;animation-duration:13s;animation-delay:-9s;width:5px;height:5px}.particle:nth-child(5){left:73%;animation-duration:11s;animation-delay:-6s}.particle:nth-child(6){left:91%;animation-duration:14s;animation-delay:-10s;width:4px;height:4px}.particle:nth-child(7){left:48%;animation-duration:16s;animation-delay:-12s;width:3px;height:3px}.particle:nth-child(8){left:15%;animation-duration:15s;animation-delay:-11s;width:3px;height:3px}
#board{height:72%;flex:none;display:grid;gap:10px;min-height:0;position:relative;z-index:2}.option{--c:#2f7cff;position:relative;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border:2px solid var(--c);border-radius:18px;padding:0;overflow:hidden;background:#09121a;box-shadow:0 0 18px color-mix(in srgb,var(--c) 25%,transparent)}.option:before{content:"";position:absolute;top:-35%;left:-70%;width:45%;height:170%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent);transform:rotate(17deg);z-index:3;pointer-events:none;animation:shine 5.8s ease-in-out infinite}.option:nth-child(2):before{animation-delay:-1s}.option:nth-child(3):before{animation-delay:-2s}.option:nth-child(4):before{animation-delay:-3s}.option:nth-child(5):before{animation-delay:-4s}.option:nth-child(6):before{animation-delay:-5s}.option.leader{box-shadow:0 0 30px color-mix(in srgb,var(--c) 58%,transparent);animation:leaderPulse 2.4s ease-in-out infinite}.rank{position:absolute;left:7px;top:7px;width:30px;height:30px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:12px;font-weight:900;z-index:5;box-shadow:0 2px 8px #0009}.crown{position:absolute;top:6px;right:7px;font-size:40px;display:none;filter:drop-shadow(0 5px 9px #000);z-index:5}.option.leader .crown{display:block;animation:crownFloat 1.4s ease-in-out infinite alternate}.photo{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background:#12202b;display:grid;place-items:center;font-size:48px}.photo img{width:100%;height:100%;object-fit:cover;transform:scale(1.035);animation:kenburns 10s ease-in-out infinite alternate}.option:nth-child(even) .photo img{animation-direction:alternate-reverse}.option:after{content:"";position:absolute;inset:42% 0 0;background:linear-gradient(180deg,transparent,rgba(2,7,11,.78) 35%,rgba(2,7,11,.96));z-index:1;pointer-events:none}.name{position:relative;z-index:2;font-size:clamp(13px,2.8vw,20px);font-weight:900;margin:0 6px 7px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:calc(100% - 12px);text-shadow:0 2px 6px #000}.count{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:7px;font-size:clamp(24px,5.5vw,38px);font-weight:1000;color:var(--c);line-height:1;margin:0 0 12px;text-shadow:0 2px 6px #000}.gift-icon{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 2px 4px #0008);animation:giftBob 1.8s ease-in-out infinite alternate}.gift-fallback{font-size:26px;animation:giftBob 1.8s ease-in-out infinite alternate}.live-time{border:1px solid #ffffff12;border-radius:14px;background:#09131c;padding:10px;text-align:center;font-size:12px;color:#c6d0d7;position:relative;z-index:3;margin-top:auto}.live-time b{color:#ff4d6d}.live-clock{font-size:18px;font-weight:900;color:#fff;margin-left:6px;font-variant-numeric:tabular-nums}.last{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font-size:9px;color:#7f98a8;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:4}
@keyframes kenburns{0%{transform:scale(1.035) translate3d(-1%,0,0)}50%{transform:scale(1.075) translate3d(1%,-.6%,0)}100%{transform:scale(1.045) translate3d(0,1%,0)}}@keyframes shine{0%,64%{left:-70%;opacity:0}72%{opacity:1}90%,100%{left:135%;opacity:0}}@keyframes crownFloat{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-7px) rotate(4deg)}}@keyframes giftBob{from{transform:translateY(0)}to{transform:translateY(-3px)}}@keyframes leaderPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.08)}}@keyframes titleGlow{0%,100%{text-shadow:0 0 0 rgba(153,84,255,0)}50%{text-shadow:0 0 16px rgba(153,84,255,.38)}}@keyframes floatUp{0%{transform:translateY(0) scale(.75);opacity:0}12%{opacity:.75}85%{opacity:.35}100%{transform:translateY(-1050px) scale(1.25);opacity:0}}
</style></head><body><main class="app"><div id="motionBg"><i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i></div><section class="title"><div class="label">NOME DA BATALHA</div><h1 id="battleTitle">BATALHA DAS OPÇÕES</h1><p id="battleSubtitle">Envie presentes para a sua opção favorita!</p></section><section id="board"></section><section class="live-time"><b>🔴 TEMPO DE LIVE</b><span id="liveClock" class="live-clock">00:00:00</span></section><div id="last" class="last">Aguardando presentes...</div></main>
<script>
const board=document.getElementById('board'),last=document.getElementById('last'),titleEl=document.getElementById('battleTitle'),subEl=document.getElementById('battleSubtitle'),liveClock=document.getElementById('liveClock');let state={battle:{title:'BATALHA DAS OPÇÕES',subtitle:''},options:[],lastGift:null};const liveStarted=Date.now();
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function layout(n){if(n<=1)return{c:1,r:1};if(n===2)return{c:2,r:1};if(n===3)return{c:3,r:1};if(n===4)return{c:2,r:2};return{c:3,r:2}}function updateClock(){const total=Math.floor((Date.now()-liveStarted)/1000),h=Math.floor(total/3600),m=Math.floor(total%3600/60),s=total%60;liveClock.textContent=[h,m,s].map(v=>String(v).padStart(2,'0')).join(':')}setInterval(updateClock,1000);updateClock();
function render(){titleEl.textContent=state.battle?.title||'BATALHA DAS OPÇÕES';subEl.textContent=state.battle?.subtitle||'';const opts=[...state.options].slice(0,6).sort((a,b)=>b.count-a.count),max=opts.length?Math.max(...opts.map(o=>o.count)):0,top=opts.filter(o=>o.count===max),leaderId=max>0&&top.length===1?top[0].id:null;const l=layout(opts.length);board.style.gridTemplateColumns=`repeat(${l.c},minmax(0,1fr))`;board.style.gridTemplateRows=`repeat(${l.r},minmax(0,1fr))`;board.innerHTML=opts.map((o,i)=>`<article class="option${o.id===leaderId?' leader':''}" style="--c:${o.color}"><div class="rank">${i+1}º</div><div class="crown">👑</div><div class="photo">${o.image?`<img src="${o.image}" alt="">`:'🖼️'}</div><div class="name">${esc(o.name)}</div><div class="count">${o.giftIcon?`<img class="gift-icon" src="${o.giftIcon}" alt="">`:'<span class="gift-fallback">🎁</span>'}<span>${o.count}</span></div></article>`).join('');if(state.lastGift){const g=state.lastGift;last.textContent=`${g.user?.nickname||g.user?.uniqueId||'Usuário'} +${g.repeatCount||1} → ${g.optionName}`}}
function connect(){const p=location.protocol==='https:'?'wss':'ws',ws=new WebSocket(`${p}://${location.host}/events`);ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='state'||m.type==='gift'){state.battle=m.battle||state.battle;state.options=m.options||state.options;state.lastGift=m.lastGift??state.lastGift;render()}};ws.onclose=()=>setTimeout(connect,2500)}fetch('/api/state').then(r=>r.json()).then(s=>{state=s;render()});connect();
</script></body></html>
