<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Batalha de Opções</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050a0f;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:grid;place-items:center}.app{width:min(100vw,56.25vh);height:min(100vh,177.78vw);aspect-ratio:9/16;position:relative;padding:18px 16px 20px;display:flex;flex-direction:column;gap:12px;overflow:hidden;background:radial-gradient(circle at 50% 10%,#14283b 0,#071019 48%,#03070b 100%);background-size:cover;background-position:center}.app:before{content:"";position:absolute;inset:0;background:rgba(2,7,11,.28);z-index:0;pointer-events:none}.title{text-align:center;position:relative;z-index:3}.title h1{margin:0 0 4px;font-family:Impact,Haettenschweiler,'Arial Narrow Bold','Trebuchet MS',sans-serif;font-size:clamp(28px,7vw,48px);font-style:italic;font-weight:900;letter-spacing:1.8px;line-height:.96;text-transform:uppercase;color:#fff;text-shadow:0 3px 0 #54219b,0 5px 0 #2c1154,0 8px 16px rgba(0,0,0,.7),0 0 18px rgba(166,92,255,.42);transform:skewX(-4deg);animation:titleGlow 3.2s ease-in-out infinite}.title p{margin:0;color:#d2dbe2;font-size:12px;text-shadow:0 2px 5px #000}.particle{position:absolute;bottom:-30px;width:6px;height:6px;border-radius:50%;background:rgba(118,205,255,.32);box-shadow:0 0 12px rgba(118,205,255,.32);animation:floatUp linear infinite;z-index:1}.particle:nth-child(1){left:8%;animation-duration:9s;animation-delay:-2s}.particle:nth-child(2){left:22%;animation-duration:12s;animation-delay:-7s}.particle:nth-child(3){left:39%;animation-duration:10s;animation-delay:-4s}.particle:nth-child(4){left:58%;animation-duration:13s;animation-delay:-9s}.particle:nth-child(5){left:73%;animation-duration:11s;animation-delay:-6s}.particle:nth-child(6){left:91%;animation-duration:14s;animation-delay:-10s}#board{height:60%;flex:none;display:grid;gap:10px;min-height:0;position:relative;z-index:2}.option{--c:#2f7cff;position:relative;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border:2px solid var(--c);border-radius:18px;padding:0;overflow:hidden;background:#09121a;box-shadow:0 0 18px color-mix(in srgb,var(--c) 25%,transparent)}.option:before{content:"";position:absolute;top:-35%;left:-70%;width:45%;height:170%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent);transform:rotate(17deg);z-index:3;pointer-events:none;animation:shine 5.8s ease-in-out infinite}.option.leader{box-shadow:0 0 30px color-mix(in srgb,var(--c) 58%,transparent);animation:leaderPulse 2.4s ease-in-out infinite}.rank{position:absolute;left:7px;top:7px;width:30px;height:30px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:12px;font-weight:900;z-index:5;box-shadow:0 2px 8px #0009}.crown{position:absolute;top:6px;right:7px;font-size:40px;display:none;z-index:5}.option.leader .crown{display:block;animation:crownFloat 1.4s ease-in-out infinite alternate}.photo{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background:#12202b;display:grid;place-items:center;font-size:48px}.photo img{width:100%;height:100%;object-fit:cover;animation:kenburns 10s ease-in-out infinite alternate}.option:after{content:"";position:absolute;inset:42% 0 0;background:linear-gradient(180deg,transparent,rgba(2,7,11,.78) 35%,rgba(2,7,11,.96));z-index:1}.name{position:relative;z-index:2;font-size:clamp(13px,2.8vw,20px);font-weight:900;margin:0 6px 7px;text-align:center;width:calc(100% - 12px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 6px #000}.count{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:7px;font-size:clamp(24px,5.5vw,38px);font-weight:1000;color:var(--c);margin:0 0 12px;text-shadow:0 2px 6px #000}.gift-icon{width:30px;height:30px;object-fit:contain;animation:giftBob 1.8s ease-in-out infinite alternate}.gift-fallback{font-size:26px}.live-time{border:1px solid #ffffff12;border-radius:14px;background:#09131ccc;padding:10px;text-align:center;position:relative;z-index:3;margin-top:auto}.live-clock{font-size:22px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}.champ{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px}.champ.show{display:flex}.champ img{width:78%;max-height:55%;object-fit:cover;border-radius:24px;border:5px solid #ffd84d;box-shadow:0 0 60px #ffd84d88;animation:champIn .65s cubic-bezier(.2,.9,.2,1)}.champ .fallback{font-size:120px}.champ h2{font-size:34px;margin:16px 0 4px;color:#ffd84d}.champ p{font-size:20px;margin:0}.fireworks{position:absolute;inset:0;overflow:hidden;pointer-events:none}.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;left:50%;top:45%;animation:boom 1.25s ease-out forwards}.spark:nth-child(3n){background:#ffd84d}.spark:nth-child(3n+1){background:#ff5a7a}.spark:nth-child(3n+2){background:#66d9ff}@keyframes champIn{from{transform:scale(.35) rotate(-6deg);opacity:0}to{transform:scale(1);opacity:1}}@keyframes boom{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}@keyframes kenburns{0%{transform:scale(1.035) translateX(-1%)}100%{transform:scale(1.07) translateX(1%)}}@keyframes shine{0%,64%{left:-70%;opacity:0}72%{opacity:1}90%,100%{left:135%;opacity:0}}@keyframes crownFloat{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-7px) rotate(4deg)}}@keyframes giftBob{from{transform:translateY(0)}to{transform:translateY(-3px)}}@keyframes leaderPulse{50%{filter:brightness(1.08)}}@keyframes titleGlow{0%,100%{filter:brightness(1);text-shadow:0 3px 0 #54219b,0 5px 0 #2c1154,0 8px 16px rgba(0,0,0,.7),0 0 12px rgba(166,92,255,.28)}50%{filter:brightness(1.08);text-shadow:0 3px 0 #6a27c2,0 5px 0 #32105f,0 8px 18px rgba(0,0,0,.72),0 0 25px rgba(178,108,255,.62)}}@keyframes floatUp{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-1050px);opacity:0}}</style></head><body><main id="app" class="app"><i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i><section class="title"><h1 id="battleTitle">BATALHA DAS OPÇÕES</h1><p id="battleSubtitle"></p></section><section id="board"></section><section class="live-time"><span id="liveClock" class="live-clock">00:00:00</span></section><section id="champ" class="champ"><div id="fireworks" class="fireworks"></div><div id="champMedia"></div><h2>🏆 CAMPEÃO</h2><p id="champName"></p></section></main><script>const app=document.getElementById('app'),board=document.getElementById('board'),titleEl=document.getElementById('battleTitle'),subEl=document.getElementById('battleSubtitle'),liveClock=document.getElementById('liveClock'),champ=document.getElementById('champ'),champMedia=document.getElementById('champMedia'),champName=document.getElementById('champName'),fireworks=document.getElementById('fireworks');let state={battle:{title:'BATALHA DAS OPÇÕES',subtitle:'',backgroundImage:''},options:[]},timer={elapsedMs:0,running:false,startedAt:null};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function layout(n){if(n<=1)return{c:1,r:1};if(n===2)return{c:2,r:1};if(n===3)return{c:3,r:1};if(n===4)return{c:2,r:2};return{c:3,r:2}}function timerNow(){return Math.max(0,Number(timer.elapsedMs)||0)+(timer.running&&timer.startedAt?Math.max(0,Date.now()-Number(timer.startedAt)):0)}function fmt(ms){const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return[h,m,s].map(v=>String(v).padStart(2,'0')).join(':')}setInterval(()=>liveClock.textContent=fmt(timerNow()),250);function render(){titleEl.textContent=state.battle?.title||'BATALHA DAS OPÇÕES';subEl.textContent=state.battle?.subtitle||'';const bg=state.battle?.backgroundImage||'';app.style.backgroundImage=bg?`linear-gradient(rgba(2,7,11,.22),rgba(2,7,11,.22)),url("${bg}")`:'';const opts=[...state.options].slice(0,6).sort((a,b)=>b.count-a.count),max=opts.length?Math.max(...opts.map(o=>o.count)):0,top=opts.filter(o=>o.count===max),leaderId=max>0&&top.length===1?top[0].id:null,l=layout(opts.length);board.style.gridTemplateColumns=`repeat(${l.c},minmax(0,1fr))`;board.style.gridTemplateRows=`repeat(${l.r},minmax(0,1fr))`;board.innerHTML=opts.map((o,i)=>`<article class="option${o.id===leaderId?' leader':''}" style="--c:${o.color}"><div class="rank">${i+1}º</div><div class="crown">👑</div><div class="photo">${o.image?`<img src="${o.image}">`:'🖼️'}</div><div class="name">${esc(o.name)}</div><div class="count">${o.giftIcon?`<img class="gift-icon" src="${o.giftIcon}">`:'<span class="gift-fallback">🎁</span>'}<span>${o.count}</span></div></article>`).join('')}function showChampion(c){champMedia.innerHTML=c.image?`<img src="${c.image}">`:'<div class="fallback">🏆</div>';champName.textContent=`${c.name} · ${c.count} pontos`;champ.classList.add('show');fireworks.innerHTML='';for(let i=0;i<90;i++){const s=document.createElement('i');s.className='spark';const a=Math.random()*Math.PI*2,d=80+Math.random()*260;s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');s.style.left=(30+Math.random()*40)+'%';s.style.top=(25+Math.random()*45)+'%';s.style.animationDelay=(Math.random()*.65)+'s';fireworks.appendChild(s)}setTimeout(()=>champ.classList.remove('show'),12000)}function applyMessage(m){if(m.type==='state'||m.type==='gift'){state.battle=m.battle||state.battle;state.options=m.options||state.options;if(m.timer)timer={...m.timer};render()}else if(m.type==='timer'&&m.timer){timer={...m.timer};liveClock.textContent=fmt(timerNow())}else if(m.type==='champion'&&m.champion)showChampion(m.champion)}function connect(){const p=location.protocol==='https:'?'wss':'ws',ws=new WebSocket(`${p}://${location.host}/events`);ws.onmessage=e=>{try{applyMessage(JSON.parse(e.data))}catch{}};ws.onclose=()=>setTimeout(connect,2500)}fetch('/api/state').then(r=>r.json()).then(s=>{state=s;timer={...(s.timer||timer)};render();liveClock.textContent=fmt(timerNow())});connect();</script></body></html>
