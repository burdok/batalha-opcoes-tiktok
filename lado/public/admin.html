<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin LADO</title><style>*{box-sizing:border-box}body{margin:0;background:#071019;color:#fff;font-family:Arial,sans-serif}main{max-width:1100px;margin:auto;padding:18px}.card{background:#102433;border:1px solid #ffffff12;border-radius:16px;padding:16px;margin-bottom:16px}h1,h2{margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.side{background:#091923;border-radius:14px;padding:14px}.a{border:1px solid #1597ff55}.b{border:1px solid #ff313155}label{display:block;font-size:12px;font-weight:900;margin:8px 0 5px;color:#c7d8e4}input,button,select{width:100%;padding:11px;border-radius:10px;border:1px solid #ffffff14;background:#07141d;color:#fff}button{cursor:pointer;font-weight:1000}.blue{background:#155f87}.red{background:#862b35}.green{background:#176b3b}.gold{background:#8b6600}.attacks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.attack{min-height:78px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{font-size:12px;color:#9db4c4;margin-top:10px}.preview{width:100%;height:130px;object-fit:cover;border-radius:10px;margin-top:8px;background:#061019}@media(max-width:800px){.grid,.row{grid-template-columns:1fr}.attacks{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><h1>⚔️ ADMIN — LADO A × LADO B</h1><section class="card"><h2>Configuração da batalha</h2><div class="row"><div><label>Título</label><input id="title" value="BATALHA"></div><div><label>HP inicial</label><input id="maxHp" type="number" value="10000" min="100"></div></div></section><section class="grid"><div class="side a"><h2>LADO A</h2><label>Nome</label><input id="nameA" value="LADO A"><label>Cor</label><input id="colorA" type="color" value="#1597ff"><label>Imagem da base</label><input id="imageA" type="file" accept="image/*"><img id="previewA" class="preview"></div><div class="side b"><h2>LADO B</h2><label>Nome</label><input id="nameB" value="LADO B"><label>Cor</label><input id="colorB" type="color" value="#ff3131"><label>Imagem da base</label><input id="imageB" type="file" accept="image/*"><img id="previewB" class="preview"></div></section><section class="card"><h2>🔥 Testar ataques</h2><div class="grid"><div><h3>LADO A ATACA</h3><div id="atkA" class="attacks"></div></div><div><h3>LADO B ATACA</h3><div id="atkB" class="attacks"></div></div></div></section><section class="card"><div class="row"><button class="green" onclick="save()">💾 SALVAR CONFIGURAÇÃO</button><button class="red" onclick="resetGame()">🔄 REINICIAR BATALHA</button></div><div id="msg" class="status"></div></section></main><script>const $=id=>document.getElementById(id);let attacks={},state=null,images={A:'',B:''};async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})});const d=await r.json();if(!r.ok)throw Error(d.error||'Erro');return d}function fileToData(file){return new Promise((ok,fail)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=fail;r.readAsDataURL(file)})}async function pick(side){const f=$('image'+side).files[0];if(!f)return;images[side]=await fileToData(f);$('preview'+side).src=images[side]}$('imageA').onchange=()=>pick('A');$('imageB').onchange=()=>pick('B');function buttons(side){return Object.entries(attacks).map(([key,a])=>`<button class="attack ${side==='A'?'blue':'red'}" onclick="fire('${side}','${key}')">${a.icon}<br>${a.label}<br>-${a.damage} HP</button>`).join('')}async function fire(side,type){try{await post('/api/attack',{from:side,type});$('msg').textContent='✅ Ataque enviado'}catch(e){$('msg').textContent='⚠️ '+e.message}}async function save(){try{const body={title:$('title').value,maxHp:+$('maxHp').value,sides:{A:{name:$('nameA').value,color:$('colorA').value,image:images.A},B:{name:$('nameB').value,color:$('colorB').value,image:images.B}}};const d=await post('/api/config',body);state=d.state;$('msg').textContent='✅ Configuração salva'}catch(e){$('msg').textContent='⚠️ '+e.message}}async function resetGame(){try{await post('/api/reset',{});$('msg').textContent='✅ Batalha reiniciada'}catch(e){$('msg').textContent='⚠️ '+e.message}}async function load(){const d=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json());state=d.state;attacks=d.attacks;$('title').value=state.title;$('maxHp').value=state.maxHp;for(const s of ['A','B']){$('name'+s).value=state.sides[s].name;$('color'+s).value=state.sides[s].color;images[s]=state.sides[s].image||'';$('preview'+s).src=images[s]||''}$('atkA').innerHTML=buttons('A');$('atkB').innerHTML=buttons('B')}load();</script></body></html>
