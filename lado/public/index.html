<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LADO - Batalha</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#05070a;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:grid;place-items:center}.app{width:min(100vw,56.25vh);height:min(100vh,177.78vw);aspect-ratio:9/16;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 15%,#1d2733,#070b10 55%,#020304);border:1px solid #ffffff10}.top{position:absolute;top:0;left:0;right:0;height:17%;display:grid;grid-template-columns:1fr 120px 1fr;z-index:10;background:#05080dcc;backdrop-filter:blur(5px);border-bottom:1px solid #ffffff14}.sideHead{padding:16px 12px}.sideHead.right{text-align:right}.sideName{font-weight:1000;font-size:24px}.hpText{font-weight:900;font-size:20px;margin-top:8px}.hpBar{height:18px;background:#111;border-radius:999px;overflow:hidden;margin-top:6px}.hpFill{height:100%;width:100%;transition:width .45s ease}.centerTop{display:grid;place-items:center;text-align:center}.title{font-size:24px;font-weight:1000;letter-spacing:2px}.vs{font-size:30px;font-weight:1000}.field{position:absolute;top:17%;bottom:20%;left:0;right:0;display:grid;grid-template-columns:1fr 1fr}.zone{position:relative;overflow:hidden}.zone.a{background:linear-gradient(180deg,#0b2f5044,#0b2030aa)}.zone.b{background:linear-gradient(180deg,#50101044,#301010aa)}.divider{position:absolute;left:50%;top:0;bottom:0;width:2px;background:linear-gradient(#2da7ff,#fff,#ff3939);box-shadow:0 0 20px #fff8;z-index:4}.base{position:absolute;bottom:5%;left:8%;right:8%;height:32%;border:2px solid #ffffff24;border-radius:16px;background:#0d1118cc;display:grid;place-items:center;overflow:hidden;box-shadow:0 14px 30px #0008}.base img{width:100%;height:100%;object-fit:cover}.baseFallback{font-size:70px}.damage{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);z-index:20;background:#07090de8;border:1px solid #ffffff22;border-radius:14px;padding:12px 18px;text-align:center;font-weight:900;opacity:0;transition:.2s}.damage.show{animation:damagePop 1.8s ease forwards}.projectile{position:absolute;z-index:30;font-size:46px;top:43%;opacity:0;pointer-events:none}.projectile.fromA{left:20%;animation:flyA 1s ease-in forwards}.projectile.fromB{right:20%;animation:flyB 1s ease-in forwards}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:29}.flash.go{animation:flash .45s ease}.bottom{position:absolute;left:0;right:0;bottom:0;height:20%;background:#05080de8;border-top:1px solid #ffffff14;padding:10px 12px;z-index:12}.last{font-size:18px;font-weight:1000;text-align:center;margin-bottom:8px}.history{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:110px;overflow:hidden}.row{padding:7px 9px;background:#0b1118;border-radius:9px;font-size:12px;display:flex;justify-content:space-between;gap:8px}.winner{position:absolute;inset:0;z-index:50;display:none;place-items:center;text-align:center;background:radial-gradient(circle,#6e4b00cc,#050505f2 55%)}.winner.show{display:grid}.winner h2{font-size:56px;margin:0;color:#ffd84d;text-shadow:0 0 25px #ffbf00}.winner p{font-size:28px;font-weight:1000}.smoke{position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#7775,#2223,transparent 70%);filter:blur(8px);animation:smoke 7s ease-in-out infinite alternate}.s1{left:-40px;bottom:20%}.s2{right:-40px;bottom:28%;animation-delay:-3s}@keyframes flyA{0%{opacity:1;transform:translateX(0) rotate(10deg) scale(.8)}100%{opacity:1;transform:translateX(240px) rotate(10deg) scale(1.15)}}@keyframes flyB{0%{opacity:1;transform:translateX(0) rotate(190deg) scale(.8)}100%{opacity:1;transform:translateX(-240px) rotate(190deg) scale(1.15)}}@keyframes flash{0%{opacity:0}30%{opacity:.8}100%{opacity:0}}@keyframes damagePop{0%{opacity:0;transform:translate(-50%,-35%) scale(.8)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(.95)}}@keyframes smoke{to{transform:translateY(-35px) scale(1.15);opacity:.5}}</style></head><body><main class="app"><div class="smoke s1"></div><div class="smoke s2"></div><section class="top"><div class="sideHead"><div id="nameA" class="sideName">LADO A</div><div id="hpA" class="hpText">10000 HP</div><div class="hpBar"><div id="barA" class="hpFill" style="background:#1597ff"></div></div></div><div class="centerTop"><div><div id="title" class="title">BATALHA</div><div class="vs">VS</div></div></div><div class="sideHead right"><div id="nameB" class="sideName">LADO B</div><div id="hpB" class="hpText">10000 HP</div><div class="hpBar"><div id="barB" class="hpFill" style="background:#ff3131"></div></div></div></section><section class="field"><div class="zone a"><div id="baseA" class="base"><div class="baseFallback">🏰</div></div></div><div class="zone b"><div id="baseB" class="base"><div class="baseFallback">🏯</div></div></div><div class="divider"></div><div id="projectile" class="projectile"></div><div id="flash" class="flash"></div><div id="damage" class="damage"></div></section><section class="bottom"><div id="last" class="last">AGUARDANDO ATAQUE...</div><div id="history" class="history"></div></section><section id="winner" class="winner"><div><h2>VITÓRIA!</h2><p id="winnerText"></p></div></section></main><script>const $=id=>document.getElementById(id);let state={maxHp:10000,sides:{A:{},B:{}},history:[]};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){const a=state.sides.A,b=state.sides.B,max=state.maxHp||10000;$('title').textContent=state.title||'BATALHA';$('nameA').textContent=a.name||'LADO A';$('nameB').textContent=b.name||'LADO B';$('hpA').textContent=`${a.hp} HP / ${max}`;$('hpB').textContent=`${b.hp} HP / ${max}`;$('barA').style.width=(a.hp/max*100)+'%';$('barB').style.width=(b.hp/max*100)+'%';$('barA').style.background=a.color||'#1597ff';$('barB').style.background=b.color||'#ff3131';$('baseA').innerHTML=a.image?`<img src="${a.image}">`:'<div class="baseFallback">🏰</div>';$('baseB').innerHTML=b.image?`<img src="${b.image}">`:'<div class="baseFallback">🏯</div>';$('history').innerHTML=(state.history||[]).slice(0,6).map(x=>`<div class="row"><span>${x.from} → ${x.to} ${x.icon} ${esc(x.label)}</span><b>-${x.damage}</b></div>`).join('');$('winner').classList.toggle('show',!!state.winner);if(state.winner)$('winnerText').textContent=(state.sides[state.winner]?.name||state.winner)+' VENCEU'}function playAttack(a){if(!a)return;const p=$('projectile');p.textContent=a.icon;p.className='projectile '+(a.from==='A'?'fromA':'fromB');void p.offsetWidth;p.className='projectile '+(a.from==='A'?'fromA':'fromB');setTimeout(()=>{$('flash').classList.remove('go');void $('flash').offsetWidth;$('flash').classList.add('go');$('damage').innerHTML=`${a.icon} ${esc(a.label)}<br><span style="color:#ff4545;font-size:28px">-${a.damage} HP</span>`;$('damage').classList.remove('show');void $('damage').offsetWidth;$('damage').classList.add('show')},850);$('last').textContent=`${state.sides[a.from]?.name||a.from} atacou ${state.sides[a.to]?.name||a.to} com ${a.label}`;setTimeout(()=>{p.className='projectile';p.textContent=''},1200)}async function load(){const d=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json());state=d.state;render()}function connect(){const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/events`);ws.onmessage=e=>{const m=JSON.parse(e.data);state=m.state;render();if(m.type==='attack')playAttack(m.attack)};ws.onclose=()=>setTimeout(connect,1500)}load().then(connect);</script></body></html>
