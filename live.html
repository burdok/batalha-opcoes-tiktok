<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Batalha de Opções - Live Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Black+Ops+One&family=Bowlby+One+SC&family=Lilita+One&family=Luckiest+Guy&family=Russo+One&family=Titan+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Arial,sans-serif}body{display:block}.stage{position:relative;width:100vw;height:100vh;min-width:320px;min-height:360px;overflow:hidden;padding:clamp(8px,1.6vw,22px);display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:clamp(6px,1.2vh,14px);background:radial-gradient(circle at 50% 8%,#14283b,#071019 48%,#03070b);background-size:cover;background-position:center}.stage:before{content:"";position:absolute;inset:0;background:#02070b3d;z-index:0;pointer-events:none}.title,.board,.donor-zone,.live-time{position:relative;z-index:2}.title{text-align:center;min-width:0}.title h1{margin:0;font-weight:900;line-height:.96;letter-spacing:.04em;text-transform:uppercase;-webkit-text-stroke:clamp(.6px,.12vw,1.5px) #111;text-shadow:0 3px 0 #111,0 8px 18px #000a;font-size:clamp(22px,5vw,64px)}.title p{margin:4px 0 0;color:#d8e1e7;font-size:clamp(10px,1.5vw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.board{display:grid;gap:clamp(6px,1vw,14px);min-height:0}.option{--c:#2f7cff;position:relative;min-width:0;min-height:0;border:clamp(1px,.18vw,3px) solid var(--c);border-radius:clamp(12px,1.8vw,22px);overflow:hidden;background:#09121a;box-shadow:0 0 22px color-mix(in srgb,var(--c) 28%,transparent);display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.option.leader{overflow:visible;box-shadow:0 0 34px color-mix(in srgb,var(--c) 62%,transparent)}.photo{position:absolute;inset:0;background:#12202b;overflow:hidden;border-radius:inherit}.photo img{width:100%;height:100%;object-fit:cover;transform:scale(1.02)}.option:after{content:"";position:absolute;inset:38% 0 0;background:linear-gradient(180deg,transparent,#02070bc7 35%,#02070bf7);z-index:1}.rank{position:absolute;z-index:5;left:clamp(5px,.8vw,10px);top:clamp(5px,.8vw,10px);width:clamp(25px,4vw,42px);height:clamp(25px,4vw,42px);border-radius:50%;background:var(--c);display:grid;place-items:center;font-weight:900;font-size:clamp(10px,1.4vw,16px)}.crown{position:absolute;z-index:8;right:clamp(4px,.8vw,10px);top:clamp(-30px,-3.2vw,-18px);font-size:clamp(30px,5vw,58px);visibility:hidden;filter:drop-shadow(0 4px 5px #000a);transform:translateY(0)}.leader .crown{visibility:visible;animation:crownFloat 2.4s ease-in-out infinite alternate}.name{position:relative;z-index:3;width:calc(100% - 12px);margin:0 6px clamp(4px,.7vh,9px);text-align:center;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 8px #000;font-size:clamp(12px,2.7vw,28px)}.count{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:clamp(4px,.7vw,10px);margin-bottom:clamp(8px,1.2vh,16px);font-weight:1000;color:var(--c);text-shadow:0 2px 8px #000;font-size:clamp(22px,5vw,54px)}.gift-icon{width:clamp(24px,4vw,44px);height:clamp(24px,4vw,44px);object-fit:contain;animation:giftFloat 2.8s ease-in-out infinite alternate}.gift-fallback{display:inline-block;font-size:clamp(22px,4vw,42px);animation:giftFloat 2.8s ease-in-out infinite alternate}.donor-zone{height:clamp(48px,8vh,78px);display:flex;align-items:center;justify-content:center;overflow:hidden}.donor-card{width:min(96%,900px);height:clamp(44px,7vh,68px);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:clamp(7px,1vw,12px);padding:clamp(5px,.8vw,9px) clamp(8px,1.2vw,14px);border:1px solid #ffffff2a;border-radius:clamp(10px,1.5vw,18px);background:linear-gradient(90deg,#07131ef0,#10283bf0,#07131ef0);box-shadow:0 8px 24px #0008;opacity:0;transform:translateX(110%)}.donor-card.show{animation:donorPass 5s cubic-bezier(.2,.75,.2,1) forwards}.donor-avatar,.donor-gift{width:clamp(34px,5vh,52px);height:clamp(34px,5vh,52px);border-radius:50%;object-fit:cover;background:#142b3b}.donor-gift{border-radius:10px}.donor-user{font-weight:900;font-size:clamp(11px,1.8vw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.donor-detail{font-size:clamp(9px,1.4vw,15px);color:#c5d8e5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.donor-detail b{color:#ffd84d}.live-time{justify-self:center;min-width:min(240px,70vw);padding:clamp(6px,1vh,11px) clamp(12px,2vw,22px);border:1px solid #ffffff12;border-radius:14px;background:#09131ccc;text-align:center}.live-clock{font-size:clamp(16px,3vw,30px);font-weight:900}.champ{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,#5f430aaa,#130d03ee 38%,#000 80%);backdrop-filter:blur(5px)}.champ.show{display:flex}.champ-media{position:relative;width:min(55vw,55vh,460px);aspect-ratio:1}.champ-media:before{content:'👑';position:absolute;z-index:7;top:clamp(-60px,-7vh,-38px);left:50%;transform:translateX(-50%);font-size:clamp(58px,10vw,100px)}.champ-media img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:clamp(4px,.7vw,8px) solid #ffd84d;box-shadow:0 0 38px #ffd84dcc}.champ-badge{font-family:Bangers,Impact;font-size:clamp(18px,4vw,42px);letter-spacing:.12em;color:#fff2a5;text-shadow:0 3px 0 #8c5b00,0 0 18px #ffd84d;margin-bottom:14px}.champ h2{font-family:Bangers,Impact;font-size:clamp(42px,10vw,96px);margin:18px 0 8px;color:#ffd84d}.champ-score{margin-top:10px;padding:8px 18px;border-radius:999px;background:#ffd84d;color:#251400;font-weight:900;font-size:clamp(14px,2.5vw,24px)}.fireworks{position:absolute;inset:0;overflow:hidden}.spark{position:absolute;width:9px;height:9px;border-radius:50%;background:#ffd84d;animation:boom 1.45s ease-out forwards}
@keyframes crownFloat{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-8px) rotate(2deg)}}
@keyframes giftFloat{from{transform:translateY(0) scale(1)}to{transform:translateY(-6px) scale(1.04)}}
@keyframes donorPass{0%{opacity:0;transform:translateX(110%) scale(.96)}10%{opacity:1;transform:translateX(0) scale(1)}78%{opacity:1;transform:translateX(0) scale(1)}100%{opacity:0;transform:translateX(-110%) scale(.96)}}
@keyframes boom{to{transform:translate(var(--x),var(--y));opacity:0}}
@media (orientation:landscape){.stage{grid-template-rows:auto minmax(0,1fr) auto auto}.title h1{font-size:clamp(20px,3.5vw,48px)}.name{font-size:clamp(12px,1.8vw,24px)}.count{font-size:clamp(22px,3.4vw,44px)}}
</style>
</head>
<body>
<main id="stage" class="stage">
<section class="title"><h1 id="battleTitle">BATALHA DAS OPÇÕES</h1><p id="battleSubtitle"></p></section>
<section id="board" class="board"></section>
<section class="donor-zone"><div id="donorCard" class="donor-card"></div></section>
<section id="liveTime" class="live-time"><span id="liveClock" class="live-clock">00:00:00</span></section>
<section id="champ" class="champ"><div id="fireworks" class="fireworks"></div><div id="champBadge" class="champ-badge"></div><div id="champMedia" class="champ-media"></div><h2>CAMPEÃO!</h2><p id="champName"></p><div id="champScore" class="champ-score"></div></section>
</main>
<script>
const $=id=>document.getElementById(id),stage=$('stage'),board=$('board'),titleEl=$('battleTitle'),subEl=$('battleSubtitle'),liveTime=$('liveTime'),liveClock=$('liveClock'),donorCard=$('donorCard'),champ=$('champ'),champBadge=$('champBadge'),champMedia=$('champMedia'),champName=$('champName'),champScore=$('champScore'),fireworks=$('fireworks');
let state={battle:{showTimer:false},options:[]},timer={elapsedMs:0,running:false,startedAt:null},giftQueue=[],giftPlaying=false,signature='';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function timerNow(){return Math.max(0,+timer.elapsedMs||0)+(timer.running&&timer.startedAt?Math.max(0,Date.now()-+timer.startedAt):0)}
function fmt(ms){let t=Math.floor(ms/1000);return[Math.floor(t/3600),Math.floor(t%3600/60),t%60].map(v=>String(v).padStart(2,'0')).join(':')}
setInterval(()=>liveClock.textContent=fmt(timerNow()),250);
function gridFor(n){if(n<=1)return{c:1,r:1};if(n===2)return{c:2,r:1};if(n===3)return{c:3,r:1};if(n===4)return{c:2,r:2};if(n<=6)return{c:3,r:2};return{c:3,r:2}}
function render(){const b=state.battle||{};titleEl.textContent=b.title||'BATALHA DAS OPÇÕES';titleEl.style.fontFamily=`'${b.titleFont||'Bangers'}',sans-serif`;subEl.textContent=b.subtitle||'';liveTime.style.display=b.showTimer===true?'block':'none';stage.style.backgroundImage=b.backgroundImage?`linear-gradient(#02070b35,#02070b35),url("${b.backgroundImage}")`:'';const opts=[...(state.options||[])].slice(0,6).sort((a,b)=>(+b.count||0)-(+a.count||0)),max=opts.length?Math.max(...opts.map(o=>+o.count||0)):0,leaders=opts.filter(o=>(+o.count||0)===max),lead=max>0&&leaders.length===1?leaders[0].id:null,{c,r}=gridFor(opts.length);board.style.gridTemplateColumns=`repeat(${c},minmax(0,1fr))`;board.style.gridTemplateRows=`repeat(${r},minmax(0,1fr))`;const sig=JSON.stringify({c,r,b:[b.title,b.subtitle,b.backgroundImage,b.titleFont,b.showTimer],opts:opts.map(o=>[o.id,o.name,o.image,o.giftIcon,o.color])});if(sig!==signature){signature=sig;board.innerHTML=opts.map((o,i)=>`<article class="option${o.id===lead?' leader':''}" data-id="${esc(o.id)}" style="--c:${o.color};order:${i}"><div class="rank">${i+1}º</div><div class="crown">👑</div><div class="photo">${o.image?`<img src="${o.image}">`:''}</div><div class="name">${esc(o.name)}</div><div class="count">${o.giftIcon?`<img class="gift-icon" src="${o.giftIcon}">`:'<span class="gift-fallback">🎁</span>'}<span class="count-value">${+o.count||0}</span></div></article>`).join('')}else{opts.forEach((o,i)=>{const el=board.querySelector(`[data-id="${CSS.escape(String(o.id))}"]`);if(!el)return;el.style.order=String(i);el.classList.toggle('leader',o.id===lead);const rank=el.querySelector('.rank'),count=el.querySelector('.count-value');if(rank)rank.textContent=`${i+1}º`;if(count)count.textContent=String(+o.count||0)})}}
function queueGift(g){if(!g)return;giftQueue.push(g);if(giftQueue.length>30)giftQueue.shift();playGift()}
function playGift(){if(giftPlaying||!giftQueue.length)return;giftPlaying=true;const g=giftQueue.shift(),u=g.user||{},avatar=u.avatar||'',gift=g.giftImage||'',q=Math.max(1,+g.repeatCount||1);donorCard.innerHTML=`${avatar?`<img class="donor-avatar" src="${esc(avatar)}">`:'<div class="donor-avatar"></div>'}<div><div class="donor-user">${esc(u.nickname||u.uniqueId||'TikTok')}</div><div class="donor-detail">${g.source==='comment'?`comentou <b>${esc(g.comment||g.optionName||'')}</b> → ${esc(g.optionName||'')}`:`enviou <b>${q}x ${esc(g.giftName||'presente')}</b> → ${esc(g.optionName||'')}`}</div></div>${gift?`<img class="donor-gift" src="${esc(gift)}">`:'<div class="donor-gift"></div>'}`;donorCard.classList.remove('show');requestAnimationFrame(()=>{void donorCard.offsetWidth;donorCard.classList.add('show')});setTimeout(()=>{donorCard.classList.remove('show');giftPlaying=false;playGift()},5100)}
function fireworksBurst(){fireworks.innerHTML='';for(let i=0;i<90;i++){const s=document.createElement('i'),a=Math.random()*Math.PI*2,d=70+Math.random()*240;s.className='spark';s.style.left=(15+Math.random()*70)+'%';s.style.top=(15+Math.random()*55)+'%';s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');fireworks.appendChild(s)}}
function showChampion(c){champBadge.textContent=c.championLabel||state.battle?.championLabel||'★ VENCEDOR DA BATALHA ★';champMedia.innerHTML=c.image?`<img src="${c.image}">`:'';champName.textContent=c.name||'';champScore.textContent=`${c.count||0} ${+c.count===1?'PONTO':'PONTOS'}`;champ.classList.add('show');fireworksBurst();setTimeout(()=>champ.classList.remove('show'),12000)}
function apply(m){if(m.type==='state'||m.type==='gift'||m.type==='commentVote'){state.battle=m.battle||state.battle;state.options=Array.isArray(m.options)?m.options:state.options;if(m.timer)timer={...m.timer};render();if(m.type==='gift')queueGift(m.lastGift);if(m.type==='commentVote')queueGift(m.vote)}else if(m.type==='timer'&&m.timer)timer={...m.timer};else if(m.type==='champion')showChampion(m.champion)}
async function syncState(){try{const r=await fetch('/api/state?ts='+Date.now(),{cache:'no-store'});if(!r.ok)return;const s=await r.json();if(Array.isArray(s.options)){state=s;timer={...(s.timer||timer)};render()}}catch{}}
function connect(){const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/events`);ws.onmessage=e=>{try{apply(JSON.parse(e.data))}catch{}};ws.onopen=()=>syncState();ws.onclose=()=>setTimeout(connect,2000)}
syncState();setInterval(syncState,1500);connect();
</script>
</body>
</html>
