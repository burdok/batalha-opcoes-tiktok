<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Batalha de Opções - Live Studio 1080x1920</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Black+Ops+One&family=Bowlby+One+SC&family=Lilita+One&family=Luckiest+Guy&family=Russo+One&family=Titan+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center}.viewport{position:relative;width:100vw;height:100vh;overflow:hidden;background:#000}.stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;background:radial-gradient(circle at 50% 8%,#14283b,#071019 48%,#03070b);background-size:cover;background-position:center;overflow:hidden;padding:34px 34px 38px;display:grid;grid-template-rows:150px minmax(0,1fr) 112px 86px;gap:18px}.stage:before{content:"";position:absolute;inset:0;background:#02070b3f;z-index:0;pointer-events:none}.title,.board,.donor-zone,.live-time{position:relative;z-index:2}.title{text-align:center;display:flex;flex-direction:column;justify-content:center}.title h1{margin:0;font-weight:900;line-height:.94;letter-spacing:1.5px;text-transform:uppercase;font-size:64px;-webkit-text-stroke:1.5px #111;text-shadow:0 4px 0 #111,0 10px 24px #000a}.title p{margin:10px 0 0;color:#d8e1e7;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.board{display:grid;gap:18px;min-height:0}.option{--c:#2f7cff;position:relative;min-width:0;min-height:0;border:3px solid var(--c);border-radius:26px;overflow:hidden;background:#09121a;box-shadow:0 0 28px color-mix(in srgb,var(--c) 30%,transparent);display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.option.leader{overflow:visible;box-shadow:0 0 45px color-mix(in srgb,var(--c) 65%,transparent)}.photo{position:absolute;inset:0;background:#12202b;border-radius:23px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.option:after{content:"";position:absolute;inset:42% 0 0;background:linear-gradient(180deg,transparent,#02070bc7 35%,#02070bf8);z-index:1}.rank{position:absolute;z-index:5;left:14px;top:14px;width:52px;height:52px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 3px 8px #0008}.crown{position:absolute;z-index:8;right:14px;top:-42px;font-size:72px;visibility:hidden;filter:drop-shadow(0 5px 7px #000a);will-change:transform}.leader .crown{visibility:visible;animation:crownFloat 2.8s ease-in-out infinite alternate}.name{position:relative;z-index:3;width:calc(100% - 24px);margin:0 12px 10px;text-align:center;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 3px 10px #000;font-size:34px}.count{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:18px;font-weight:1000;color:var(--c);text-shadow:0 3px 10px #000;font-size:62px}.gift-icon{width:50px;height:50px;object-fit:contain;will-change:transform;animation:giftFloat 3.2s ease-in-out infinite alternate}.gift-fallback{display:inline-block;font-size:48px;will-change:transform;animation:giftFloat 3.2s ease-in-out infinite alternate}.donor-zone{display:flex;align-items:center;justify-content:center;overflow:hidden}.donor-card{width:100%;height:92px;display:grid;grid-template-columns:72px minmax(0,1fr) 72px;align-items:center;gap:14px;padding:10px 18px;border:1px solid #ffffff2a;border-radius:20px;background:linear-gradient(90deg,#07131ef2,#10283bf2,#07131ef2);box-shadow:0 10px 28px #0009;opacity:0;transform:translateX(112%)}.donor-card.show{animation:donorPass 5s cubic-bezier(.2,.75,.2,1) forwards}.donor-avatar,.donor-gift{width:68px;height:68px;border-radius:50%;object-fit:cover;background:#142b3b}.donor-gift{border-radius:14px}.donor-user{font-weight:900;font-size:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.donor-detail{font-size:22px;color:#c5d8e5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.donor-detail b{color:#ffd84d}.live-time{justify-self:center;align-self:center;min-width:330px;padding:14px 28px;border:1px solid #ffffff12;border-radius:18px;background:#09131ccc;text-align:center}.live-clock{font-size:36px;font-weight:900}.champ{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:50px;background:radial-gradient(circle at 50% 40%,#5f430aaa,#130d03ef 38%,#000 80%);backdrop-filter:blur(6px)}.champ.show{display:flex}.champ-badge{font-family:Bangers,Impact;font-size:52px;letter-spacing:5px;color:#fff2a5;text-shadow:0 4px 0 #8c5b00,0 0 24px #ffd84d;margin-bottom:30px}.champ-media{position:relative;width:620px;height:620px}.champ-media:before{content:'👑';position:absolute;z-index:7;top:-100px;left:50%;transform:translateX(-50%);font-size:125px}.champ-media img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:10px solid #ffd84d;box-shadow:0 0 50px #ffd84dcc}.champ h2{font-family:Bangers,Impact;font-size:110px;margin:34px 0 12px;color:#ffd84d}.champ p{font-size:42px;margin:0}.champ-score{margin-top:18px;padding:14px 30px;border-radius:999px;background:#ffd84d;color:#251400;font-weight:900;font-size:30px}.fireworks{position:absolute;inset:0;overflow:hidden}.spark{position:absolute;width:12px;height:12px;border-radius:50%;background:#ffd84d;animation:boom 1.45s ease-out forwards}@keyframes crownFloat{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-14px) rotate(2deg)}}@keyframes giftFloat{from{transform:translateY(0) scale(1)}to{transform:translateY(-10px) scale(1.05)}}@keyframes donorPass{0%{opacity:0;transform:translateX(112%) scale(.96)}10%{opacity:1;transform:translateX(0) scale(1)}78%{opacity:1;transform:translateX(0) scale(1)}100%{opacity:0;transform:translateX(-112%) scale(.96)}}@keyframes boom{to{transform:translate(var(--x),var(--y));opacity:0}}
</style>
</head>
<body>
<div class="viewport" id="viewport"><main id="stage" class="stage"><section class="title"><h1 id="battleTitle">BATALHA DAS OPÇÕES</h1><p id="battleSubtitle"></p></section><section id="board" class="board"></section><section class="donor-zone"><div id="donorCard" class="donor-card"></div></section><section id="liveTime" class="live-time"><span id="liveClock" class="live-clock">00:00:00</span></section><section id="champ" class="champ"><div id="fireworks" class="fireworks"></div><div id="champBadge" class="champ-badge"></div><div id="champMedia" class="champ-media"></div><h2>CAMPEÃO!</h2><p id="champName"></p><div id="champScore" class="champ-score"></div></section></main></div>
<script>
const $=id=>document.getElementById(id),stage=$('stage'),board=$('board'),titleEl=$('battleTitle'),subEl=$('battleSubtitle'),liveTime=$('liveTime'),liveClock=$('liveClock'),donorCard=$('donorCard'),champ=$('champ'),champBadge=$('champBadge'),champMedia=$('champMedia'),champName=$('champName'),champScore=$('champScore'),fireworks=$('fireworks');let state={battle:{showTimer:false},options:[]},timer={elapsedMs:0,running:false,startedAt:null},giftQueue=[],giftPlaying=false,signature='';
function fitStage(){const s=Math.min(innerWidth/1080,innerHeight/1920);stage.style.transform=`translate(-50%,-50%) scale(${s})`}addEventListener('resize',fitStage);fitStage();
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function timerNow(){return Math.max(0,+timer.elapsedMs||0)+(timer.running&&timer.startedAt?Math.max(0,Date.now()-+timer.startedAt):0)}function fmt(ms){let t=Math.floor(ms/1000);return[Math.floor(t/3600),Math.floor(t%3600/60),t%60].map(v=>String(v).padStart(2,'0')).join(':')}setInterval(()=>liveClock.textContent=fmt(timerNow()),250);
function gridFor(n){if(n<=1)return{c:1,r:1};if(n===2)return{c:2,r:1};if(n===3)return{c:3,r:1};if(n===4)return{c:2,r:2};return{c:3,r:2}}
function render(){const b=state.battle||{};titleEl.textContent=b.title||'BATALHA DAS OPÇÕES';titleEl.style.fontFamily=`'${b.titleFont||'Bangers'}',sans-serif`;titleEl.style.fontSize=Math.max(44,Math.min(92,+b.titleSize*1.6||64))+'px';subEl.textContent=b.subtitle||'';liveTime.style.display=b.showTimer===true?'block':'none';stage.style.backgroundImage=b.backgroundImage?`linear-gradient(#02070b35,#02070b35),url("${b.backgroundImage}")`:'';const opts=[...(state.options||[])].slice(0,6).sort((a,b)=>(+b.count||0)-(+a.count||0)),max=opts.length?Math.max(...opts.map(o=>+o.count||0)):0,leaders=opts.filter(o=>(+o.count||0)===max),lead=max>0&&leaders.length===1?leaders[0].id:null,{c,r}=gridFor(opts.length);board.style.gridTemplateColumns=`repeat(${c},minmax(0,1fr))`;board.style.gridTemplateRows=`repeat(${r},minmax(0,1fr))`;const sig=JSON.stringify({c,r,b:[b.title,b.subtitle,b.backgroundImage,b.titleFont,b.titleSize,b.showTimer],opts:opts.map(o=>[o.id,o.name,o.image,o.giftIcon,o.color])});if(sig!==signature){signature=sig;board.innerHTML=opts.map((o,i)=>`<article class="option${o.id===lead?' leader':''}" data-id="${esc(o.id)}" style="--c:${o.color};order:${i}"><div class="rank">${i+1}º</div><div class="crown">👑</div><div class="photo">${o.image?`<img src="${o.image}">`:''}</div><div class="name">${esc(o.name)}</div><div class="count">${o.giftIcon?`<img class="gift-icon" src="${o.giftIcon}">`:'<span class="gift-fallback">🎁</span>'}<span class="count-value">${+o.count||0}</span></div></article>`).join('')}else{opts.forEach((o,i)=>{const el=[...board.children].find(x=>x.dataset.id===String(o.id));if(!el)return;el.style.order=String(i);el.classList.toggle('leader',o.id===lead);const rank=el.querySelector('.rank'),count=el.querySelector('.count-value');if(rank)rank.textContent=`${i+1}º`;if(count)count.textContent=String(+o.count||0)})}}
function queueGift(g){if(!g)return;giftQueue.push(g);if(giftQueue.length>30)giftQueue.shift();playGift()}function playGift(){if(giftPlaying||!giftQueue.length)return;giftPlaying=true;const g=giftQueue.shift(),u=g.user||{},avatar=u.avatar||'',gift=g.giftImage||'',q=Math.max(1,+g.repeatCount||1);donorCard.innerHTML=`${avatar?`<img class="donor-avatar" src="${esc(avatar)}">`:'<div class="donor-avatar"></div>'}<div><div class="donor-user">${esc(u.nickname||u.uniqueId||'TikTok')}</div><div class="donor-detail">${g.source==='comment'?`comentou <b>${esc(g.comment||g.optionName||'')}</b> → ${esc(g.optionName||'')}`:`enviou <b>${q}x ${esc(g.giftName||'presente')}</b> → ${esc(g.optionName||'')}`}</div></div>${gift?`<img class="donor-gift" src="${esc(gift)}">`:'<div class="donor-gift"></div>'}`;donorCard.classList.remove('show');void donorCard.offsetWidth;donorCard.classList.add('show');setTimeout(()=>{donorCard.classList.remove('show');giftPlaying=false;playGift()},5100)}
function fireworksBurst(){fireworks.innerHTML='';for(let i=0;i<100;i++){const s=document.createElement('i'),a=Math.random()*Math.PI*2,d=100+Math.random()*360;s.className='spark';s.style.left=(15+Math.random()*70)+'%';s.style.top=(15+Math.random()*55)+'%';s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');fireworks.appendChild(s)}}function showChampion(c){champBadge.textContent=c.championLabel||state.battle?.championLabel||'★ VENCEDOR DA BATALHA ★';champMedia.innerHTML=c.image?`<img src="${c.image}">`:'🏆';champName.textContent=c.name||'';champScore.textContent=`${c.count||0} ${+c.count===1?'PONTO':'PONTOS'}`;champ.classList.add('show');fireworksBurst();setTimeout(()=>champ.classList.remove('show'),12000)}
function apply(m){if(m.type==='state'||m.type==='gift'||m.type==='commentVote'){state.battle=m.battle||state.battle;state.options=Array.isArray(m.options)?m.options:state.options;if(m.timer)timer={...m.timer};render();if(m.type==='gift')queueGift(m.lastGift);if(m.type==='commentVote')queueGift(m.vote)}else if(m.type==='timer'&&m.timer)timer={...m.timer};else if(m.type==='champion'&&m.champion)showChampion(m.champion)}async function syncState(){try{const r=await fetch('/api/state?ts='+Date.now(),{cache:'no-store'});if(!r.ok)return;const s=await r.json();if(Array.isArray(s.options)){state=s;timer={...(s.timer||timer)};render()}}catch{}}function connect(){const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/events`);ws.onmessage=e=>{try{apply(JSON.parse(e.data))}catch{}};ws.onopen=syncState;ws.onclose=()=>setTimeout(connect,2000)}syncState();setInterval(syncState,1500);connect();
</script>
</body></html>
